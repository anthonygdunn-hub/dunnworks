<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0a0a">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("dw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  body { padding-block: 24px 80px; }
  .hd { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between;
        margin-bottom:26px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .hd h1 { font-size: clamp(24px,3.2vw,34px); }
  .sub { color:var(--muted); font-size:14.5px; margin-top:6px; }
  .crumb { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
           color:var(--muted-2); margin-bottom:7px; }
  .crumb a { color:var(--muted-2); text-decoration:none; }
  .crumb a:hover { color:var(--accent-2); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  .menu { display:grid; grid-template-columns:repeat(auto-fit,minmax(224px,1fr)); gap:12px; }
  .tile { display:block; text-decoration:none; color:inherit; border:1px solid var(--line);
          border-radius:var(--radius); background:var(--ink-2); padding:24px 22px 22px;
          transition:border-color .15s ease, transform .15s ease; }
  .tile:hover, .tile:focus-visible { border-color:var(--accent); transform:translateY(-2px); }
  .tile .n { display:block; font-family:var(--font-display); font-size:36px; font-weight:700;
             line-height:1; color:var(--accent-2); margin-bottom:12px; }
  .tile b { display:block; font-family:var(--font-display); font-size:19px; font-weight:600; }
  .tile p { color:var(--muted); font-size:14px; margin-top:7px; }
  .tile .flag { margin-top:11px; display:inline-block; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:9px; margin-bottom:20px; }
  .stat { border:1px solid var(--line); border-radius:var(--radius); background:var(--ink-2); padding:13px 15px; }
  .stat b { display:block; font-family:var(--font-display); font-size:23px; line-height:1; }
  .stat span { font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted-2); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; }
  .chip { font-family:var(--font-mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase;
          padding:8px 11px; border:1px solid var(--line-2); border-radius:var(--radius);
          background:transparent; color:var(--muted); cursor:pointer; }
  .chip.is-on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .bar input[type=search], .bar select { padding:9px 12px; border:1px solid var(--line-2); border-radius:var(--radius);
          background:var(--ink-2); color:var(--paper); font:inherit; font-size:14.5px; }
  .bar input[type=search] { flex:1 1 200px; min-width:150px; }
  .h-sub { font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
           color:var(--muted-2); margin:26px 0 12px; }
  .h-sub:first-child { margin-top:0; }
  .cards { display:grid; gap:11px; }
  .c { border:1px solid var(--line); border-radius:var(--radius); background:var(--ink-2); padding:17px 19px; }
  .c.is-due { border-color:var(--accent); }
  .c.is-cold { opacity:.6; }
  .c-top { display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between; }
  .c h3 { font-size:17.5px; }
  .tagline { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2); }
  .det { color:var(--muted); font-size:14.5px; margin:8px 0 11px; }
  .det a { color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
  .det a:hover { color:var(--accent-2); }
  .flag { position:static; background:transparent; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
          padding:3px 7px; border-radius:var(--radius); border:1px solid var(--line-2); color:var(--muted-2); }
  .flag.warn { border-color:var(--accent); color:var(--accent-2); }
  .mini { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
          padding:6px 10px; border:1px solid var(--line-2); border-radius:var(--radius);
          background:transparent; color:var(--muted); cursor:pointer; text-decoration:none; display:inline-block; }
  .mini:hover { border-color:var(--accent-2); color:var(--accent-2); }
  .score { font-family:var(--font-display); font-size:22px; font-weight:700; }
  .s-hot { color:#4fd08a; } .s-warm { color:var(--accent-2); } .s-cool { color:var(--muted); }
  .edit { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:9px; margin-top:13px;
          padding-top:13px; border-top:1px solid var(--line); }
  .edit label { display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em;
                text-transform:uppercase; color:var(--muted-2); margin-bottom:5px; }
  .edit input, .edit select, .edit textarea {
          width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:var(--radius);
          background:var(--ink); color:var(--paper); font:inherit; font-size:14px; }
  .edit textarea { min-height:42px; resize:vertical; }
  .edit .wide { grid-column:1/-1; }
  .saved { font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#4fd08a; }
  .gate { max-width:420px; margin:9vh auto 0; }
  .gate .field { margin-bottom:15px; }
  .gate label { display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
                text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .gate input { width:100%; padding:12px 14px; border:1px solid var(--line-2); border-radius:var(--radius);
                background:var(--ink-2); color:var(--paper); font:inherit; }
  .msg { font-size:14.5px; margin-top:12px; min-height:20px; }
  .msg.bad { color:var(--bad); } .msg.ok { color:#4fd08a; }
  .set { margin-top:13px; border-top:1px solid var(--line); padding-top:11px; }
  .set > summary { cursor:pointer; list-style:none; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em;
                   text-transform:uppercase; color:var(--muted); display:inline-flex; gap:8px; align-items:center; }
  .set > summary::-webkit-details-marker { display:none; }
  .set > summary::before { content:'+'; display:inline-block; width:12px; color:var(--accent-2); }
  .set[open] > summary::before { content:'–'; }
  .set > summary:hover { color:var(--accent-2); }
  .set .edit { border-top:0; padding-top:4px; }
  .edit label.chk { display:flex; gap:9px; align-items:center; font-family:inherit; font-size:14px; letter-spacing:0; text-transform:none; cursor:pointer; color:var(--paper); margin:6px 0 0; }
  .edit label.chk .note { font-size:12.5px; }
  .edit label.chk input { width:17px; height:17px; accent-color:#4fd08a; flex:none; cursor:pointer; }
  .pass { display:flex; gap:8px; }
  .pass input { font-family:var(--font-mono); }
  .set-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:4px; }
  .mini.go { border-color:var(--accent); color:var(--accent-2); }
  .mini.bad { color:var(--bad); }
  .note { font-size:13px; color:var(--muted); }
  .note.ok { color:#4fd08a; } .note.bad { color:var(--bad); }
  .flag.live { border-color:rgba(79,208,138,.5); color:#4fd08a; }
  .c.fold { border-left:3px solid var(--accent); padding:0; }
  .c.fold.is-live { border-left-color:#4fd08a; }
  .c.fold.is-arch { border-left-color:var(--line-2); opacity:.75; }
  .c-head { display:flex; align-items:center; gap:14px; width:100%; background:none; border:0; margin:0; padding:15px 19px;
            color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .c-head:hover h3 { color:var(--accent-2); }
  .c-head > div { flex:1; min-width:0; }
  .c-head .c-sum { display:block; color:var(--muted); font-size:13.5px; margin-top:5px; }
  .c-arrow { flex:none; width:18px; text-align:center; color:var(--accent-2); font-size:13px; transition:transform .2s ease; }
  .c.fold.is-open .c-arrow { transform:rotate(180deg); }
  .c-body { display:none; padding:0 19px 17px; }
  .c.fold.is-open .c-body { display:block; }
  .tk-box { margin-top:13px; padding-top:13px; border-top:1px solid var(--line); }
  .tk-head { display:flex; align-items:center; gap:10px; }
  .tk-head b { font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted-2); font-weight:400; }
  .tk-bar { flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  .tk-bar i { display:block; height:100%; background:#4fd08a; }
  .tk-head span { font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; color:var(--muted-2); white-space:nowrap; }
  .tk-list { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; }
  .tk { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--radius); background:var(--ink); }
  .tk.done { border-left-color:#4fd08a; opacity:.72; }
  .tk.late { border-left-color:var(--bad); }
  .tk-row { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .tk-row input[type=checkbox] { width:18px; height:18px; accent-color:#4fd08a; flex:none; cursor:pointer; margin:0; }
  .tk-open { flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 0; margin:0;
             color:var(--paper); font:inherit; font-size:14.5px; text-align:left; cursor:pointer; }
  .tk-open .tt { flex:1; min-width:0; }
  .tk-open .tt small { display:block; color:var(--muted-2); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tk.is-open .tk-open .tt small { display:none; }
  .tk.done .tk-open .tt > span { color:var(--muted-2); text-decoration:line-through; }
  .tk-due { flex:none; font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2);
            padding:3px 7px; border:1px solid var(--line-2); border-radius:var(--radius); white-space:nowrap; }
  .tk.late .tk-due { color:var(--bad); border-color:var(--bad); }
  .tk-arrow { flex:none; width:18px; text-align:center; color:var(--accent-2); font-size:12px; transition:transform .2s ease; }
  .tk.is-open .tk-arrow { transform:rotate(180deg); }
  .tk-body { display:none; padding:2px 12px 14px 40px; }
  .tk.is-open .tk-body { display:block; }
  .tk-body .tk-det { color:var(--muted); font-size:14px; margin:0 0 12px; white-space:pre-line; }
  .tk-body .tk-meta { font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted-2); margin-bottom:12px; }
  .tk-edit { display:grid; grid-template-columns:1fr 150px; gap:8px; }
  .tk-edit label { display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted-2); margin-bottom:5px; }
  .tk-edit input, .tk-edit textarea { width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:var(--radius); background:var(--ink-2); color:var(--paper); font:inherit; font-size:14px; }
  .tk-edit textarea { min-height:60px; resize:vertical; }
  .tk-edit .wide { grid-column:1/-1; }
  .tk-edit .acts { grid-column:1/-1; display:flex; gap:8px; align-items:center; }
  @media (max-width:620px){ .tk-body { padding-left:12px; } .tk-edit { grid-template-columns:1fr; } }
  .tk-add { display:grid; grid-template-columns:1.3fr 1.3fr 150px auto; gap:8px; margin-top:9px; }
  .tk-add input { width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:var(--radius); background:var(--ink); color:var(--paper); font:inherit; font-size:14px; }
  .tk-add .mini { padding:8px 12px; }
  @media (max-width:620px){ .tk-add { grid-template-columns:1fr auto; } .tk-add input[name=details] { grid-column:1/-1; order:3; } .tk-add input[name=due] { order:4; } }
  @media (max-width:620px){ .c { padding:15px 16px; } .tile { padding:20px 18px 18px; } }
</style>
</head>
<body>

<main class="wrap" id="main">

  <section class="gate" id="gate-auth" hidden>
    <h1 class="h3" style="margin-bottom:8px">Admin</h1>
    <p style="color:var(--muted); font-size:15px; margin-bottom:24px">Dunnworks. Sign in to carry on.</p>
    <form id="signin" class="card" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="info@dunnworks.io" value="info@dunnworks.io">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" autofocus>
      </div>
      <button class="btn btn--wide" type="submit">Sign in</button>
      <p class="msg" id="auth-msg" role="status" aria-live="polite"></p>
      <p style="color:var(--muted-2); font-size:13.5px; margin-top:4px">
        Forgotten it? <button type="button" class="mini" id="magic">Email me a link</button>
      </p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="hd">
      <div>
        <p class="crumb" id="crumb"><a href="#/">Dunnworks admin</a></p>
        <h1 id="title">Admin</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="row">
        <a class="mini" href="#/">All areas</a>
        <button class="mini" id="addproj" type="button">Add a project</button>
        <button class="mini" id="signout" type="button">Sign out</button>
      </div>
    </div>

    <div id="view"></div>
    <p class="msg" id="app-msg" role="status" aria-live="polite"></p>
  </section>

</main>

<script src="../assets/js/dw-config.js"></script>
<script src="../assets/js/dw-data.js"></script>
<script src="../assets/js/dw-keys.js"></script>
<script>
(function () {
  'use strict';

  /* Tokens arrive in the URL hash after a magic link. Take them before anything
     else touches the hash, because they do not survive a reload. */
  DWData.captureFromHash();

  var gateAuth = document.getElementById('gate-auth');
  var app = document.getElementById('app');
  var viewEl = document.getElementById('view');
  var appMsg = document.getElementById('app-msg');
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var crumbEl = document.getElementById('crumb');

  var D = { projects: [], keys: {}, jobs: [], enquiries: [], run: null, tasks: {}, secrets: {}, keyrows: [] };
  var ui = { openCards: {}, openTasks: {}, stage: 'all', sector: '', q: '', cat: 'all', min: 45, jstatus: 'open' };
  var STAGES = ['not-contacted','emailed','called','replied','meeting','quoted','won','lost','parked'];
  var WARM = ['replied','meeting','quoted'];

  function say(el, text, cls) { el.className = 'msg' + (cls ? ' ' + cls : ''); el.textContent = text || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function today() { return new Date().toISOString().slice(0,10); }
  function when(iso) {
    if (!iso) return '';
    var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d < 28) return d + ' days ago';
    return Math.round(d / 7) + ' weeks ago';
  }
  function isDue(r) { return r.next_action_on && r.next_action_on <= today() && r.stage !== 'won' && r.stage !== 'lost'; }
  function isClient(r) { return r.kind === 'case-study' || r.status === 'live'; }
  function isWip(r) { return !isClient(r) && (r.status === 'ready' || WARM.indexOf(r.stage) !== -1); }
  function isTarget(r) { return !isClient(r) && !isWip(r); }

  /* ---- sign in ---- */
  document.getElementById('signin').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('password').value;
    if (!pw) { say(document.getElementById('auth-msg'), 'Put your password in.', 'bad'); return; }
    say(document.getElementById('auth-msg'), 'Signing in...');
    DWData.signInWithPassword(email, pw).then(start)
      .catch(function (err) { say(document.getElementById('auth-msg'), err.message || 'That did not work.', 'bad'); });
  });

  document.getElementById('magic').addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!email) { say(document.getElementById('auth-msg'), 'Put your email address in first.', 'bad'); return; }
    DWData.sendMagicLink(email, location.origin + '/console/')
      .then(function () { say(document.getElementById('auth-msg'), 'Link sent. Open it on this device.', 'ok'); })
      .catch(function (err) { say(document.getElementById('auth-msg'), err.message || 'Could not send it.', 'bad'); });
  });

  document.getElementById('signout').addEventListener('click', function () {
    DWData.signOut().then(function () { location.hash = ''; location.reload(); });
  });

  /* ---- data ---- */
  function load() {
    say(appMsg, 'Loading...');
    return Promise.all([
      DWData.rest('dw_projects?select=*&order=name.asc'),
      DWData.rest('dw_project_secrets?select=*').catch(function () { return []; }),
      DWData.rest('dw_jobs?select=*&order=score.desc,posted_at.desc').catch(function () { return []; }),
      DWData.rest('tcooper_enquiries?select=*&order=created_at.desc').catch(function () { return []; }),
      DWData.rest('dw_job_runs?select=*&order=started_at.desc&limit=1').catch(function () { return []; }),
      DWData.rest('dw_project_tasks?select=*&order=done.asc,sort_order.asc,created_at.asc').catch(function () { return []; }),
      DWData.keys().catch(function () { return []; })
    ]).then(function (out) {
      D.projects = out[0] || [];
      /* One passphrase per project opens both its site and its report. */
      D.keys = {};
      D.secrets = {};
      (out[1] || []).forEach(function (k) { D.secrets[k.project_id] = k; });
      D.keyrows = out[6] || [];
      var slugOf = {};
      D.projects.forEach(function (p) { slugOf[p.id] = p; });
      (out[1] || []).forEach(function (k) {
        var p = slugOf[k.project_id];
        if (!p || !k.passphrase) return;
        D.keys[p.slug] = { site: p.has_preview ? k.passphrase : null, report: p.has_report ? k.passphrase : null };
      });
      D.tasks = {};
      (out[5] || []).forEach(function (t) { (D.tasks[t.project_id] = D.tasks[t.project_id] || []).push(t); });
      D.jobs = out[2] || [];
      D.enquiries = out[3] || [];
      D.run = (out[4] || [])[0] || null;
      say(appMsg, '');
      route();
    }).catch(function (err) { say(appMsg, err.message, 'bad'); });
  }

  function patch(table, id, body, el) {
    return DWData.rest(table + '?id=eq.' + encodeURIComponent(id), {
      method:'PATCH', body:body, headers:{ Prefer:'return=minimal' }
    }).then(function () {
      if (el) { el.textContent = 'Saved'; setTimeout(function () { el.textContent = ''; }, 1600); }
    }).catch(function (err) { say(appMsg, err.message, 'bad'); });
  }

  /* ---- router ---- */
  var AREAS = [
    { id:'wip',       name:'Work in progress', blurb:'Live jobs and anyone who has come back to you' },
    { id:'previews',  name:'Previews',         blurb:'Every concept site and report, with its passphrase' },
    { id:'targets',   name:'People to target', blurb:'The prospect list, who to chase and when' },
    { id:'jobs',      name:'Job search',       blurb:'Customer success and field sales roles, scored' },
    { id:'enquiries', name:'Enquiries',        blurb:'Messages from the T Cooper Interiors form' }
  ];
  var VIEWS = { wip:viewWip, previews:viewPreviews, targets:viewTargets, jobs:viewJobs, enquiries:viewEnquiries };

  function counts() {
    var due = D.projects.filter(function (r) { return isTarget(r) && isDue(r); }).length;
    return {
      wip: D.projects.filter(isWip).length + D.projects.filter(isClient).length,
      previews: D.projects.filter(function (p) { return p.has_preview || p.has_report; }).length,
      targets: D.projects.filter(isTarget).length,
      jobs: D.jobs.filter(function (j) { return (j.score || 0) >= 45 && j.status !== 'hidden' && j.status !== 'rejected'; }).length,
      enquiries: D.enquiries.length,
      due: due,
      todo: Object.keys(D.tasks).reduce(function (n, k) { return n + D.tasks[k].filter(function (t) { return !t.done; }).length; }, 0)
    };
  }

  function route() {
    var id = (location.hash || '').replace(/^#\/?/, '');
    if (!VIEWS[id]) {
      crumbEl.innerHTML = 'Dunnworks admin';
      titleEl.textContent = 'Admin';
      subEl.textContent = D.run ? 'Jobs last checked ' + when(D.run.started_at) + '.' : 'Pick an area.';
      viewMenu();
      window.scrollTo(0, 0);
      return;
    }
    var a = AREAS.filter(function (x) { return x.id === id; })[0];
    crumbEl.innerHTML = '<a href="#/">Dunnworks admin</a> / ' + esc(a.name);
    titleEl.textContent = a.name;
    subEl.textContent = a.blurb;
    ui.q = '';

  }
  window.addEventListener('hashchange', route);

  /* ---- menu ---- */
  function viewMenu() {
    var c = counts();
    viewEl.innerHTML = '<div class="menu">' + AREAS.map(function (a) {
      var extra = a.id === 'targets' && c.due
        ? '<span class="flag warn">' + c.due + ' to chase</span>' : '';
      if (a.id === 'wip' && c.todo) extra = '<span class="flag warn">' + c.todo + ' jobs to do</span>';
      return '<a class="tile" href="#/' + a.id + '">' +
        '<span class="n">' + c[a.id] + '</span>' +
        '<b>' + a.name + '</b>' +
        '<p>' + a.blurb + '</p>' + extra +
      '</a>';
    }).join('') + '</div>';
  }

  /* ---- work in progress ---- */
  function viewWip() {
    var wip = D.projects.filter(isWip).sort(function (a, b) {
      return WARM.indexOf(b.stage) - WARM.indexOf(a.stage) || (a.name || '').localeCompare(b.name || '');
    });
    var clients = D.projects.filter(isClient).sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

    viewEl.innerHTML =
      '<p class="h-sub">In play &middot; ' + wip.length + '</p>' +
      (wip.length ? '<div class="cards">' + wip.map(projectCard).join('') + '</div>'
                  : '<p style="color:var(--muted)">Nothing in play. Send a preview from the targets list to start one.</p>') +
      '<p class="h-sub">Live sites &middot; ' + clients.length + '</p>' +
      '<div class="cards">' + clients.map(projectCard).join('') + '</div>';
  }

  /* ---- targets ---- */
  function viewTargets() {
    var all = D.projects.filter(isTarget);
    var c = { total: all.length, due: 0 };
    STAGES.forEach(function (s) { c[s] = 0; });
    all.forEach(function (r) { c[r.stage] = (c[r.stage] || 0) + 1; if (isDue(r)) c.due++; });

    var sectors = {};
    all.forEach(function (r) { if (r.sector) sectors[r.sector] = 1; });

    var rows = all.filter(function (r) {
      if (ui.stage === 'due') { if (!isDue(r)) return false; }
      else if (ui.stage !== 'all' && r.stage !== ui.stage) return false;
      if (ui.sector && r.sector !== ui.sector) return false;
      if (ui.q) {
        var hay = [r.name, r.sector, r.address, r.outreach_notes, r.contact_name, r.next_action].join(' ').toLowerCase();
        if (hay.indexOf(ui.q.toLowerCase()) === -1) return false;
      }
      return true;
    }).sort(function (a, b) {
      var ad = isDue(a) ? 0 : 1, bd = isDue(b) ? 0 : 1;
      if (ad !== bd) return ad - bd;
      return (a.name || '').localeCompare(b.name || '');
    });

    viewEl.innerHTML =
      '<div class="stats">' +
        [['Targets', c.total], ['Chase now', c.due], ['Not contacted', c['not-contacted']],
         ['Emailed', c.emailed], ['Called', c.called], ['Parked', c.parked]]
        .map(function (s) { return '<div class="stat"><b>' + s[1] + '</b><span>' + s[0] + '</span></div>'; }).join('') +
      '</div>' +
      '<div class="bar">' +
        ['all','due'].concat(STAGES).map(function (s) {
          return '<button class="chip' + (ui.stage === s ? ' is-on' : '') + '" data-stage="' + s + '">' +
            (s === 'all' ? 'All' : s === 'due' ? 'Chase now' : s.replace('-', ' ')) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="bar">' +
        '<input type="search" id="q" placeholder="Search name, sector, town, notes" value="' + esc(ui.q) + '">' +
        '<select id="sector"><option value="">All sectors</option>' +
          Object.keys(sectors).sort().map(function (s) {
            return '<option value="' + esc(s) + '"' + (ui.sector === s ? ' selected' : '') + '>' + esc(s) + '</option>';
          }).join('') +
        '</select>' +
        '<span class="tagline">' + rows.length + ' of ' + all.length + '</span>' +
      '</div>' +
      '<div class="cards">' + rows.map(projectCard).join('') + '</div>';
  }

  /* ---- jobs to do ---- */
  function openJobs(id) { return (D.tasks[id] || []).filter(function (t) { return !t.done; }).length; }
  function taskBox(r) {
    var list = D.tasks[r.id] || [];
    var done = list.length - openJobs(r.id);
    var pct = list.length ? Math.round(done / list.length * 100) : 0;
    var t0 = today();
    return '<div class="tk-box" data-tasks>' +
      '<div class="tk-head"><b>Jobs to do</b><div class="tk-bar"><i style="width:' + pct + '%"></i></div>' +
        '<span>' + (list.length ? done + ' of ' + list.length + ' done' : 'none yet') + '</span></div>' +
      '<ul class="tk-list">' + list.map(function (t) {
        var late = t.due_on && !t.done && t.due_on < t0;
        var open = !!ui.openTasks[t.id];
        var dd = t.due_on ? t.due_on.slice(8, 10) + '/' + t.due_on.slice(5, 7) : '';
        return '<li class="tk' + (t.done ? ' done' : '') + (late ? ' late' : '') + (open ? ' is-open' : '') + '" data-tid="' + esc(t.id) + '">' +
          '<div class="tk-row">' +
            '<input type="checkbox" data-tact="toggle" aria-label="Done: ' + esc(t.title) + '"' + (t.done ? ' checked' : '') + '>' +
            '<button class="tk-open" type="button" data-tact="open" aria-expanded="' + open + '">' +
              '<span class="tt"><span>' + esc(t.title) + '</span>' + (t.details ? '<small>' + esc(t.details) + '</small>' : '') + '</span>' +
              (dd ? '<span class="tk-due">' + (late ? 'late ' : 'due ') + esc(dd) + '</span>' : '') +
              '<span class="tk-arrow" aria-hidden="true">&#9662;</span>' +
            '</button>' +
          '</div>' +
          '<div class="tk-body">' +
            (t.details ? '<p class="tk-det">' + esc(t.details) + '</p>' : '') +
            '<p class="tk-meta">' + (t.done && t.done_at ? 'Done ' + when(t.done_at) : 'Added ' + when(t.created_at)) + '</p>' +
            '<form class="tk-edit" data-tedit>' +
              '<div><label>Job</label><input name="title" type="text" value="' + esc(t.title) + '" required></div>' +
              '<div><label>Due</label><input name="due" type="date" value="' + esc(t.due_on || '') + '"></div>' +
              '<div class="wide"><label>Details</label><textarea name="details">' + esc(t.details || '') + '</textarea></div>' +
              '<div class="acts"><button class="mini" type="submit">Save</button>' +
                '<button class="mini" type="button" data-tact="del" style="color:var(--bad)">Delete</button>' +
                '<span class="saved" data-tsaved></span></div>' +
            '</form>' +
          '</div></li>';
      }).join('') + '</ul>' +
      '<form class="tk-add" data-tadd>' +
        '<input name="title" type="text" placeholder="Add a job" aria-label="New job" required>' +
        '<input name="details" type="text" placeholder="Details (optional)" aria-label="Details">' +
        '<input name="due" type="date" aria-label="Due date">' +
        '<button class="mini" type="submit">Add</button>' +
      '</form></div>';
  }
  function redrawTasks(card, id) {
    D.tasks[id] = (D.tasks[id] || []).slice().sort(function (a, b) {
      return (a.done - b.done) || (a.sort_order - b.sort_order) || (a.created_at < b.created_at ? -1 : 1);
    });
    var r = D.projects.filter(function (p) { return p.id === id; })[0];
    var tmp = document.createElement('div'); tmp.innerHTML = taskBox(r);
    card.querySelector('[data-tasks]').replaceWith(tmp.firstChild);
    var fl = card.querySelector('.flag.jobs'), n = openJobs(id);
    if (fl) { if (n) fl.textContent = n + ' to do'; else fl.remove(); }
    else if (n) card.querySelector('.c-top .tagline').insertAdjacentHTML('beforeend', ' <span class="flag warn jobs">' + n + ' to do</span>');
  }

  /* ---- project settings, moved over from the old /admin/ page ---- */
  var STATUS = [['build','In build'],['ready','Ready to review'],['live','Launched'],['archived','Archived']];
  function settings(r) {
    var sec = D.secrets[r.id] || {};
    var opt = function (list, v) { return list.map(function (s) {
      return '<option value="' + s[0] + '"' + (s[0] === v ? ' selected' : '') + '>' + s[1] + '</option>'; }).join(''); };

    return '<details class="set" data-set><summary>Project settings</summary><div class="edit">' +
      '<div class="wide"><label class="chk"><input type="checkbox" data-s="is_live"' + (r.is_live ? ' checked' : '') + '>This one is live <span class="note">(moves it to Launched on the public previews page)</span></label></div>' +
      '<div><label>Status</label><select data-s="status">' + opt(STATUS, r.status) + '</select></div>' +
      '<div><label>Kind</label><select data-s="kind">' + opt([['preview','Preview'],['case-study','Case study']], r.kind) + '</select></div>' +
      '<div><label>Live address</label><input type="url" data-s="live_url" value="' + esc(r.live_url || '') + '" placeholder="https://"></div>' +
      '<div><label>Went live on</label><input type="date" data-s="live_on" value="' + esc(r.live_on || '') + '"></div>' +
      '<div><label>Sector</label><input type="text" data-s="sector" value="' + esc(r.sector || '') + '"></div>' +
      '<div><label>Pages</label><input type="number" data-s="pages" value="' + esc(r.pages == null ? '' : r.pages) + '"></div>' +
      '<div><label>Order</label><input type="number" data-s="sort_order" value="' + esc(r.sort_order == null ? '' : r.sort_order) + '"></div>' +
      '<div><label>Website</label><input type="url" data-s="website" value="' + esc(r.website || '') + '" placeholder="Their current site"></div>' +
      '<div><label>Contact name</label><input type="text" data-s="contact_name" value="' + esc(r.contact_name || '') + '"></div>' +
      '<div><label>Phone</label><input type="text" data-s="contact_phone" value="' + esc(r.contact_phone || '') + '"></div>' +
      '<div><label>Email</label><input type="email" data-s="contact_email" value="' + esc(r.contact_email || '') + '"></div>' +
      '<div><label>Address</label><input type="text" data-s="address" value="' + esc(r.address || '') + '"></div>' +
      '<div class="wide"><label>Blurb (shown on the public previews page)</label><textarea data-s="blurb">' + esc(r.blurb || '') + '</textarea></div>' +
      '<div><label class="chk"><input type="checkbox" data-s="has_preview"' + (r.has_preview ? ' checked' : '') + '>Has a locked preview</label></div>' +
      '<div><label class="chk"><input type="checkbox" data-s="has_report"' + (r.has_report ? ' checked' : '') + '>Has a report</label></div>' +
      '<div><label class="chk"><input type="checkbox" data-s="published"' + (r.published ? ' checked' : '') + '>Show on the previews page</label></div>' +
      '<div class="wide"><label>Passphrase clients use</label><div class="pass">' +
        '<input type="text" data-p="passphrase" value="' + esc(sec.passphrase || '') + '" placeholder="not set">' +
        (canReissue ? '<button class="mini go" type="button" data-sact="newpass">New passphrase</button>' +
                      '<button class="mini" type="button" data-sact="applypass">Use what I typed</button>' : '') +
      '</div><p class="note" data-pmsg role="status" aria-live="polite">' +
        (canReissue ? 'Reissuing stops the old passphrase working straight away, so send the new one before you close this page.' : '') + '</p></div>' +
      '<div><label>Issued to</label><input type="text" data-p="issued_to" value="' + esc(sec.issued_to || '') + '"></div>' +
      '<div><label>Issued on</label><input type="date" data-p="issued_on" value="' + esc(sec.issued_on || '') + '"></div>' +
      '<div class="wide set-actions"><button class="mini go" type="button" data-sact="save">Save settings</button>' +
        '<button class="mini bad" type="button" data-sact="del">Delete project</button>' +
        '<span class="note" data-smsg role="status" aria-live="polite"></span></div>' +
    '</div></details>';
  }

  function projectCard(r, fold) {
    var k = D.keys[r.slug] || {};
    var phone = r.contact_phone ? '<a href="tel:' + esc((r.contact_phone.split('/')[0] || '').replace(/\s/g,'')) + '">' + esc(r.contact_phone) + '</a>' : '';
    var email = r.contact_email ? '<a href="mailto:' + esc(r.contact_email) + '">' + esc(r.contact_email) + '</a>' : '<span style="color:var(--muted-2)">no email published</span>';
    var site = r.live_url ? '<a href="' + esc(r.live_url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.live_url.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a>'
             : (r.website ? '<a href="' + esc(r.website) + '" target="_blank" rel="noopener noreferrer">their site</a>' : '');
    var det = [r.contact_name ? esc(r.contact_name) : '', phone, email, site, r.address ? esc(r.address) : ''].filter(Boolean).join(' &middot; ');
    var eyeball = (r.contact_source || '').indexOf('directory') === 0;

    var open = !!ui.openCards[r.id];
    var sum = ['/preview/' + esc(r.slug) + '/', r.pages ? r.pages + ' pages' : '', r.stage ? esc(r.stage.replace('-', ' ')) : '',
               r.report_on ? 'report ' + esc(r.report_on) : ''].filter(Boolean).join(' &middot; ');
    return '<article class="c' + (fold ? ' fold' + (open ? ' is-open' : '') + (r.is_live ? ' is-live' : '') + (r.status === 'archived' ? ' is-arch' : '') : '') +
        (isDue(r) ? ' is-due' : '') + (r.stage === 'lost' ? ' is-cold' : '') + '" data-table="dw_projects" data-id="' + r.id + '">' +
      (fold ? '<button class="c-head" type="button" data-cact="open" aria-expanded="' + open + '"><div>' : '') +
      '<div class="c-top"><h3>' + esc(r.name) + '</h3><span class="tagline">' + esc(r.sector || '') +
        (eyeball ? ' <span class="flag warn">check details</span>' : '') +
        (isDue(r) ? ' <span class="flag warn">due</span>' : '') +
        (r.status === 'ready' && !r.is_live ? ' <span class="flag">ready to send</span>' : '') +
        (r.is_live ? ' <span class="flag live">live</span>' : '') +
        (r.status === 'archived' ? ' <span class="flag">archived</span>' : '') +
        (openJobs(r.id) ? ' <span class="flag warn jobs">' + openJobs(r.id) + ' to do</span>' : '') + '</span></div>' +
      (fold ? '<span class="c-sum">' + sum + '</span></div><span class="c-arrow" aria-hidden="true">&#9662;</span></button><div class="c-body">' : '') +
      (det ? '<p class="det">' + det + '</p>' : '') +
      '<div class="row">' +
        (r.has_preview ? '<a class="mini" href="/preview/' + esc(r.slug) + '/" target="_blank" rel="noopener">Preview</a>' : '') +
        (r.has_report ? '<a class="mini" href="/preview/' + esc(r.slug) + '/report/" target="_blank" rel="noopener">Report</a>' : '') +
        (k.site ? '<button class="mini" data-copy="' + esc(k.site) + '">Copy site pass</button>' : '') +
        (k.report ? '<button class="mini" data-copy="' + esc(k.report) + '">Copy report pass</button>' : '') +
        (r.contact_email ? '<a class="mini" href="mailto:' + esc(r.contact_email) + '?subject=' + encodeURIComponent('A website concept for ' + (r.name || '')) + '">Email</a>' : '') +
      '</div>' +
      '<div class="edit">' +
        '<div><label>Stage</label><select data-f="stage">' +
          STAGES.map(function (s) { return '<option value="' + s + '"' + (r.stage === s ? ' selected' : '') + '>' + s.replace('-', ' ') + '</option>'; }).join('') +
        '</select></div>' +
        '<div><label>Last contact</label><input type="date" data-f="last_contact_on" value="' + esc(r.last_contact_on || '') + '"></div>' +
        '<div><label>Next action</label><input type="text" data-f="next_action" value="' + esc(r.next_action || '') + '" placeholder="Call back"></div>' +
        '<div><label>When</label><input type="date" data-f="next_action_on" value="' + esc(r.next_action_on || '') + '"></div>' +
        '<div class="wide"><label>Notes</label><textarea data-f="outreach_notes" placeholder="What was said">' + esc(r.outreach_notes || '') + '</textarea></div>' +
        '<div class="wide row" style="justify-content:flex-end"><span class="saved" data-saved></span></div>' +
      '</div>' +
      (isWip(r) || isClient(r) || (D.tasks[r.id] || []).length ? taskBox(r) : '') +
      settings(r) +
      (fold ? '</div>' : '') +
    '</article>';
  }

  /* ---- previews ---- */
  function viewPreviews() {
    var rows = D.projects.filter(function (p) { return p.has_preview || p.has_report; })
      .filter(function (r) {
        if (!ui.q) return true;
        return (r.name + ' ' + r.slug + ' ' + (r.sector || '')).toLowerCase().indexOf(ui.q.toLowerCase()) !== -1;
      })
      .sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0) || (a.name || '').localeCompare(b.name || ''); });

    viewEl.innerHTML =
      '<div class="bar"><input type="search" id="q" placeholder="Search previews" value="' + esc(ui.q) + '">' +
      '<span class="tagline">' + rows.length + ' with a preview or report</span>' +
      '<span style="flex:1 1 10px"></span><button class="mini" data-cact="all" type="button">' +
        (rows.length && rows.every(function (r) { return ui.openCards[r.id]; }) ? 'Close all' : 'Open all') + '</button></div>' +
      '<div class="cards">' + rows.map(function (r) { return projectCard(r, true); }).join('') + '</div>';
  }

  /* ---- job search ---- */
  function viewJobs() {
    var rows = D.jobs.filter(function (r) {
      if (ui.cat !== 'all' && r.category !== ui.cat) return false;
      if (ui.jstatus === 'open' && (r.status === 'hidden' || r.status === 'rejected')) return false;
      if (ui.jstatus !== 'open' && r.status !== ui.jstatus) return false;
      if ((r.score || 0) < ui.min) return false;
      if (ui.q) {
        var hay = (r.title + ' ' + (r.company || '') + ' ' + (r.location || '') + ' ' + (r.description || '')).toLowerCase();
        if (hay.indexOf(ui.q.toLowerCase()) === -1) return false;
      }
      return true;
    });

    viewEl.innerHTML =
      '<div class="bar">' +
        [['all','All'],['cs','Customer success'],['am','Account management'],['field-sales','Field sales'],['shipping','Shipping']]
          .map(function (c) { return '<button class="chip' + (ui.cat === c[0] ? ' is-on' : '') + '" data-cat="' + c[0] + '">' + c[1] + '</button>'; }).join('') +
        '<span style="flex:1 1 10px"></span>' +
        '<button class="mini" id="refresh">Refresh now</button>' +
      '</div>' +
      '<div class="bar">' +
        '<input type="search" id="q" placeholder="Search jobs" value="' + esc(ui.q) + '">' +
        [['open','Open'],['shortlist','Shortlist'],['applied','Applied'],['hidden','Hidden']]
          .map(function (s) { return '<button class="chip' + (ui.jstatus === s[0] ? ' is-on' : '') + '" data-jstatus="' + s[0] + '">' + s[1] + '</button>'; }).join('') +
        '<label class="tagline" for="min">Min score</label>' +
        '<input id="min" type="range" min="0" max="90" step="5" value="' + ui.min + '" style="width:110px">' +
        '<span class="tagline">' + ui.min + '+ &middot; ' + rows.length + ' roles</span>' +
      '</div>' +
      '<div class="cards">' + rows.map(function (r) {
        var cls = r.score >= 70 ? 's-hot' : r.score >= 50 ? 's-warm' : 's-cool';
        return '<article class="c" data-table="dw_jobs" data-id="' + r.id + '">' +
          '<div class="c-top"><h3><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) + '</a></h3>' +
          '<span class="score ' + cls + '">' + (r.score || 0) + '</span></div>' +
          '<p class="det">' + esc(r.company || 'Company not named') + ' &middot; ' + esc(r.location || 'UK') +

            (r.posted_at ? ' &middot; ' + when(r.posted_at) : '') + ' &middot; ' + esc(r.source) + '</p>' +
          ((r.score_reasons || []).length ? '<p class="det" style="margin-top:-4px"><b style="color:var(--paper);font-weight:500">Why:</b> ' +
            (r.score_reasons || []).map(esc).join(' &middot; ') + '</p>' : '') +
          '<div class="row">' +
            '<button class="mini" data-jset="shortlist">Shortlist</button>' +
            '<button class="mini" data-jset="applied">Applied</button>' +
            '<button class="mini" data-jset="hidden">Hide</button>' +

            '<span class="saved" data-saved></span>' +
          '</div></article>';
      }).join('') + '</div>';
  }

  /* ---- events ---- */
  function readSettings(card) {
    var p = {}, sec = {};
    card.querySelectorAll('[data-s]').forEach(function (i) {
      var k = i.getAttribute('data-s');
      if (i.type === 'checkbox') p[k] = i.checked;
      else if (i.type === 'number') p[k] = i.value === '' ? null : parseInt(i.value, 10);
      else p[k] = i.value.trim() === '' ? null : i.value.trim();
    });
    card.querySelectorAll('[data-p]').forEach(function (i) { sec[i.getAttribute('data-p')] = i.value.trim() || null; });
    /* the tick is what you actually use, so keep status in step with it */
    if (p.is_live && p.status !== 'live') p.status = 'live';
    if (!p.is_live && p.status === 'live') p.status = 'ready';
    return { p: p, sec: sec };
  }

  function settingsAction(btn) {
    var card = btn.closest('[data-id]'), id = card.getAttribute('data-id');
    var r = D.projects.filter(function (x) { return x.id === id; })[0];
    var act = btn.getAttribute('data-sact');
    var smsg = card.querySelector('[data-smsg]'), pmsg = card.querySelector('[data-pmsg]');
    var note = function (el, t, c) { el.className = 'note' + (c ? ' ' + c : ''); el.textContent = t || ''; };

    if (act === 'del') {
      if (!confirm('Delete ' + r.name + '? Its passphrase record and jobs go too. The preview files on the site are not touched.')) return;
      note(smsg, 'Deleting…');
      DWData.remove(id).then(load).catch(function (err) { note(smsg, err.message, 'bad'); });
      return;
    }

    if (act === 'save') {
      var v = readSettings(card);
      btn.disabled = true; note(smsg, 'Saving…');
      /* The passphrase itself only changes through the reissue buttons, which
         rewrap the file key at the same time. The stored one is sent back
         unchanged so the record keeps its required column. */
      var held = (D.secrets[id] || {}).passphrase;
      var work = DWData.update(id, v.p);
      if (held) work = work.then(function () {
        return DWData.setSecret(id, { passphrase: held, issued_to: v.sec.issued_to, issued_on: v.sec.issued_on || undefined });
      });
      work.then(function () { note(smsg, 'Saved.', 'ok'); return load(); })
        .catch(function (err) { note(smsg, err.message, 'bad'); })
        .then(function () { btn.disabled = false; });
      return;
    }

    if (act === 'newpass' || act === 'applypass') {
      var field = card.querySelector('[data-p="passphrase"]');
      var current = (D.secrets[id] || {}).passphrase;
      var next = act === 'newpass' ? DWKeys.make() : field.value.trim();
      if (!next || next.length < 12) { note(pmsg, 'Type something at least 12 characters long, or press New passphrase.', 'bad'); return; }
      if (next === current) { note(pmsg, 'That is already the passphrase.', 'bad'); return; }
      if (!confirm('Reissue the passphrase for ' + r.name + '?\n\nThe new one is ' + next + '\n\nAnyone still holding the old one stops getting in.')) return;
      var btns = card.querySelectorAll('[data-sact="newpass"],[data-sact="applypass"]');
      btns.forEach(function (x) { x.disabled = true; });
      var mine = D.keyrows.filter(function (k) { return k.slug === r.slug; });
      DWKeys.reissue(r.slug, mine, current, next, function (t) { note(pmsg, t); })
        .then(function () { return DWData.setSecret(id, { passphrase: next, issued_on: today() }); })
        .then(function () {
          field.value = next;
          D.secrets[id] = Object.assign({}, D.secrets[id] || {}, { project_id: id, passphrase: next, issued_on: today() });
          D.keys[r.slug] = { site: r.has_preview ? next : null, report: r.has_report ? next : null };
          return DWData.keys().then(function (k) { D.keyrows = k || []; });
        })
        .then(function () { note(pmsg, 'Done. Send them ' + next + '. The old one no longer works.', 'ok'); })
        .catch(function (err) { note(pmsg, 'Not reissued: ' + err.message, 'bad'); })
        .then(function () { btns.forEach(function (x) { x.disabled = false; }); });
    }
  }

  viewEl.addEventListener('click', function (e) {
    var cact = e.target.closest('[data-cact]');
    if (cact && cact.getAttribute('data-cact') === 'open') {
      var art = cact.closest('[data-id]'), cid = art.getAttribute('data-id');
      var isOpen = art.classList.toggle('is-open');
      cact.setAttribute('aria-expanded', isOpen);
      if (isOpen) ui.openCards[cid] = 1; else delete ui.openCards[cid];
      return;
    }
    if (cact && cact.getAttribute('data-cact') === 'all') {
      var arts = viewEl.querySelectorAll('.c.fold');
      var anyClosed = [].some.call(arts, function (a) { return !a.classList.contains('is-open'); });
      arts.forEach(function (a) {
        a.classList.toggle('is-open', anyClosed);
        a.querySelector('.c-head').setAttribute('aria-expanded', anyClosed);
        if (anyClosed) ui.openCards[a.getAttribute('data-id')] = 1; else delete ui.openCards[a.getAttribute('data-id')];
      });
      cact.textContent = anyClosed ? 'Close all' : 'Open all';
      return;
    }
    var sb = e.target.closest('[data-sact]');
    if (sb) { settingsAction(sb); return; }
    var topen = e.target.closest('[data-tact="open"]');
    if (topen) {
      var li = topen.closest('[data-tid]'), otid = li.getAttribute('data-tid');
      var isOpen = li.classList.toggle('is-open');
      topen.setAttribute('aria-expanded', isOpen);
      if (isOpen) ui.openTasks[otid] = 1; else delete ui.openTasks[otid];
      return;
    }
    var tdel = e.target.closest('[data-tact="del"]');
    if (tdel) {
      var tcard = tdel.closest('[data-id]'), pid = tcard.getAttribute('data-id');
      var tid = tdel.closest('[data-tid]').getAttribute('data-tid');
      if (!confirm('Delete this job?')) return;
      DWData.rest('dw_project_tasks?id=eq.' + encodeURIComponent(tid), { method:'DELETE' }).then(function () {
        D.tasks[pid] = (D.tasks[pid] || []).filter(function (t) { return t.id !== tid; });
        redrawTasks(tcard, pid);
      }).catch(function (err) { say(appMsg, err.message, 'bad'); });
      return;
    }
    var copy = e.target.closest('[data-copy]');
    if (copy) {
      var txt = copy.getAttribute('data-copy');
      navigator.clipboard.writeText(txt).then(function () {
        var was = copy.textContent; copy.textContent = 'Copied';
        setTimeout(function () { copy.textContent = was; }, 1400);
      }).catch(function () { say(appMsg, 'Copy failed. It is: ' + txt, 'bad'); });
      return;
    }
    var chip = e.target.closest('[data-stage],[data-cat],[data-jstatus]');
    if (chip) {
      if (chip.hasAttribute('data-stage')) ui.stage = chip.getAttribute('data-stage');
      if (chip.hasAttribute('data-cat')) ui.cat = chip.getAttribute('data-cat');
      if (chip.hasAttribute('data-jstatus')) ui.jstatus = chip.getAttribute('data-jstatus');
      route();
      return;
    }
    var jset = e.target.closest('[data-jset]');
    if (jset) {
      var card = jset.closest('[data-id]');
      var id = card.getAttribute('data-id');
      var next = jset.getAttribute('data-jset');
      var job = D.jobs.filter(function (j) { return j.id === id; })[0];
      if (job && job.status === next) next = 'new';
      if (job) job.status = next;
      patch('dw_jobs', id, { status: next }, card.querySelector('[data-saved]')).then(route);
      return;
    }
    if (e.target.id === 'refresh') {
      var btn = e.target;
      btn.disabled = true; btn.textContent = 'Checking...';
      say(appMsg, 'Asking Adzuna and Reed for anything new.');
      fetch(window.DW.url + '/functions/v1/fetch-jobs', {
        method:'POST',
        headers:{ apikey: window.DW.anonKey,
                  Authorization: 'Bearer ' + (JSON.parse(localStorage.getItem('dw-auth') || '{}').access_token || ''),
                  'Content-Type':'application/json' }
      }).then(function (r) { return r.json(); })
        .then(function (out) {
          if (!out.ok) throw new Error(out.error || 'the fetch failed');
          say(appMsg, 'Found ' + out.fetched + ' ads, kept ' + out.kept + '.', 'ok');
          return load();
        })
        .catch(function (err) { say(appMsg, err.message, 'bad'); })
        .finally(function () { btn.disabled = false; btn.textContent = 'Refresh now'; });
    }
  });

  viewEl.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-tact') === 'toggle') {
      var box = e.target, tcard = box.closest('[data-id]'), pid = tcard.getAttribute('data-id');
      var tid = box.closest('[data-tid]').getAttribute('data-tid');
      var t = (D.tasks[pid] || []).filter(function (x) { return x.id === tid; })[0];
      var done = box.checked;
      box.disabled = true;
      DWData.rest('dw_project_tasks?id=eq.' + encodeURIComponent(tid), {
        method:'PATCH', body:{ done: done, done_at: done ? new Date().toISOString() : null }, headers:{ Prefer:'return=minimal' }
      }).then(function () { t.done = done; redrawTasks(tcard, pid); })
        .catch(function (err) { box.checked = !done; box.disabled = false; say(appMsg, err.message, 'bad'); });
      return;
    }
    if (e.target.closest('[data-tadd]') || e.target.closest('[data-tedit]') || e.target.closest('[data-set]')) return;
    if (e.target.id === 'sector') { ui.sector = e.target.value; route(); return; }
    if (e.target.id === 'min') { ui.min = Number(e.target.value); route(); return; }
    var f = e.target.getAttribute('data-f');
    if (!f) return;
    var card = e.target.closest('[data-id]');
    var body = {};
    body[f] = e.target.value || null;
    if (f === 'stage' && e.target.value !== 'not-contacted') {
      var lc = card.querySelector('[data-f=last_contact_on]');
      if (lc && !lc.value) { body.last_contact_on = today(); lc.value = today(); }
    }
    var row = D.projects.filter(function (p) { return p.id === card.getAttribute('data-id'); })[0];
    if (row) Object.assign(row, body);
    patch('dw_projects', card.getAttribute('data-id'), body, card.querySelector('[data-saved]'));
  });

  viewEl.addEventListener('submit', function (e) {
    var ef = e.target.closest('[data-tedit]');
    if (ef) {
      e.preventDefault();
      var ecard = ef.closest('[data-id]'), epid = ecard.getAttribute('data-id');
      var etid = ef.closest('[data-tid]').getAttribute('data-tid');
      var et = (D.tasks[epid] || []).filter(function (x) { return x.id === etid; })[0];
      var body = { title: ef.elements.title.value.trim(), details: ef.elements.details.value.trim() || null, due_on: ef.elements.due.value || null };
      if (!body.title) return;
      DWData.rest('dw_project_tasks?id=eq.' + encodeURIComponent(etid), { method:'PATCH', body: body, headers:{ Prefer:'return=minimal' } })
        .then(function () { Object.assign(et, body); ui.openTasks[etid] = 1; redrawTasks(ecard, epid);
          var s2 = ecard.querySelector('[data-tid="' + etid + '"] [data-tsaved]'); if (s2) { s2.textContent = 'Saved'; setTimeout(function () { s2.textContent = ''; }, 1600); } })
        .catch(function (err) { say(appMsg, err.message, 'bad'); });
      return;
    }
    var f = e.target.closest('[data-tadd]');
    if (!f) return;
    e.preventDefault();
    var tcard = f.closest('[data-id]'), pid = tcard.getAttribute('data-id');
    var title = f.elements.title.value.trim();
    if (!title) return;
    var list = D.tasks[pid] || [];
    var row = { project_id: pid, title: title, details: f.elements.details.value.trim() || null, due_on: f.elements.due.value || null,
                sort_order: list.reduce(function (m, t) { return Math.max(m, t.sort_order || 0); }, 0) + 10 };
    f.querySelector('button').disabled = true;
    DWData.rest('dw_project_tasks', { method:'POST', body: row, headers:{ Prefer:'return=representation' } }).then(function (out) {
      D.tasks[pid] = list.concat(out || []);
      redrawTasks(tcard, pid);
      var nf = tcard.querySelector('[data-tadd] input[name=title]'); if (nf) nf.focus();
    }).catch(function (err) { f.querySelector('button').disabled = false; say(appMsg, err.message, 'bad'); });
  });

  viewEl.addEventListener('input', function (e) {
    if (e.target.id === 'q') {
      ui.q = e.target.value.trim();
      var pos = e.target.selectionStart;
      route();
      var again = document.getElementById('q');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    }
    if (e.target.id === 'min') {
      ui.min = Number(e.target.value);
      route();
      var m = document.getElementById('min'); if (m) m.focus();
    }
  });

  document.getElementById('addproj').addEventListener('click', function () {
    var name = prompt('Project name');
    if (!name) return;
    var slug = prompt('Slug, used as /preview/<slug>/', name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
    if (!slug) return;
    say(appMsg, 'Creating…');
    DWData.create({ slug: slug, name: name, kind: 'preview', status: 'build', published: false, sort_order: 90 })
      .then(function () { return load(); })
      .then(function () { say(appMsg, name + ' added. It is under People to target until it is ready.', 'ok'); })
      .catch(function (err) { say(appMsg, err.message, 'bad'); });
  });

  /* ---- boot ---- */
  function start() { gateAuth.hidden = true; app.hidden = false; load(); }

  DWData.whoami().then(function (user) {
    if (user && user.email) start(); else gateAuth.hidden = false;
  }).catch(function () { gateAuth.hidden = false; });
})();
</script>
</body>
</html>
