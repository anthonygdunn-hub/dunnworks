# Builds honesthandicap.golf from the published reviews in Supabase and deploys it to GitHub Pages.
# Runs when the source changes, when a review is published or taken down in the dunnworks.io
# console (hh-admin sends a workflow_dispatch), and once a night as a safety net.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why the site is being rebuilt
        required: false
        default: Manual rebuild
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build (${{ github.event.inputs.reason || github.event_name }})
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
