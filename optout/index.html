<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | Dunnworks</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>.oo{max-width:560px;margin:14vh auto;padding:0 22px}.oo h1{font-size:clamp(26px,4vw,38px)}.oo p{color:var(--muted);font-size:16px;margin-top:14px}.oo button{margin-top:22px}</style>
</head>
<body>
<main class="oo" id="main">
  <h1 id="h">Stop emails from Dunnworks</h1>
  <p id="p">Press the button and Dunnworks won't email your business again.</p>
  <button class="btn" id="b" type="button">Unsubscribe</button>
</main>
<script src="/assets/js/dw-config.js"></script>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '', b = document.getElementById('b');
  if (!/^[0-9a-f-]{36}$/i.test(t)) { document.getElementById('p').textContent = 'This link is incomplete. Reply "no thanks" to the email instead and you won’t hear from Dunnworks again.'; b.hidden = true; return; }
  b.addEventListener('click', function () {
    b.disabled = true;
    fetch(DW.url + '/rest/v1/rpc/dw_optout', { method: 'POST', headers: { apikey: DW.anonKey, Authorization: 'Bearer ' + DW.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: t }) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function () { document.getElementById('h').textContent = 'Done, you’re unsubscribed'; document.getElementById('p').textContent = 'Dunnworks won’t email your business again. Your free woolmer.info listing isn’t affected. Sorry to bother you.'; b.hidden = true; })
      .catch(function () { b.disabled = false; document.getElementById('p').textContent = 'Sorry, that didn’t work. Reply "no thanks" to the email instead and you won’t hear from Dunnworks again.'; });
  });
})();
</script>
</body>
</html>
