<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD Dance Academy ticket</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D81B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#D81B2C;--ink:#2B2B2E;--ink3:#66666C;--line:#F6D3DC;--bg:#FFF7F8;--ok:#1E6B43;--ok-l:#E3F3EA;--bad:#B0111F;--bad-l:#FDE4E8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(150deg,#C8102E 0%,#D6136F 60%,#FF3D8B 100%);font:400 16px/1.5 'Jost',system-ui,-apple-system,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px 16px}
.pass{width:100%;max-width:400px;background:#fff;border-radius:24px;box-shadow:0 30px 60px -20px rgba(60,6,20,.5);overflow:hidden}
.top{padding:22px 22px 10px;text-align:center}
.top img{width:200px;max-width:70%;height:auto}
.kind{font:700 .85rem 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:8px}
h1{font:700 1.4rem/1.2 'Cinzel',Georgia,serif;margin:6px 0 0;letter-spacing:.02em}
.tear{position:relative;border-top:2px dashed var(--line);margin:16px 0}
.tear::before,.tear::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:#E3236B}
.tear::before{left:-13px}.tear::after{right:-13px}
.body{padding:0 22px 22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#qr{width:220px;height:220px;display:grid;place-items:center}
#qr svg{width:100%;height:100%}
.code{font:600 1.15rem 'Jost',monospace;letter-spacing:.18em}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;text-align:left;width:100%;font-size:15px}
dt{color:var(--ink3)}dd{margin:0;font-weight:500}
.big{font:700 2.6rem/1 'Cinzel',Georgia,serif;color:var(--bad)}
.msg{font-style:italic;color:var(--ink3)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:600;font-size:14px}
.ok{background:var(--ok-l);color:var(--ok)}.bad{background:var(--bad-l);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font:600 15px 'Jost',sans-serif;cursor:pointer;color:var(--ink)}
.small{font-size:13px;color:var(--ink3)}
.empty{padding:30px 22px;text-align:center}
@media print{body{background:#fff;padding:0}.pass{box-shadow:none;border:1px solid #ddd}.btn{display:none}.tear::before,.tear::after{background:#fff;border:1px solid #ddd}}
</style>
</head>

      var e = d.event || {}, st = d.status === 'valid' ? '<span class="pill ok">Valid</span>' : d.status === 'used' ? '<span class="pill bad">Already used</span>' : '<span class="pill bad">Cancelled</span>';
      document.title = (e.title || 'Ticket') + ' · MD Dance Academy';
      show('<div class="kind">' + esc(d.kind) + ' ticket</div><h1>' + esc(e.title) + '</h1></div><div class="tear"></div><div class="body"><div id="qr">' + qr('MDT:' + d.code) + '</div><div class="code">' + esc(d.code) + '</div>' + st +
        '<dl>' + (d.holder ? '<dt>Name</dt><dd>' + esc(d.holder) + '</dd>' : '') + (e.starts_on ? '<dt>Date</dt><dd>' + esc(day(e.starts_on)) + '</dd>' : '') + (e.time_label ? '<dt>Time</dt><dd>' + esc(e.time_label) + '</dd>' : '') + (e.venue ? '<dt>Where</dt><dd>' + esc(e.venue) + '</dd>' : '') + '<dt>Paid</dt><dd>' + (d.paid ? 'Yes' : 'Pay on the door') + '</dd></dl>' +
        '<p class="small">Show this at the door. Turn your screen brightness up to scan quicker.</p><button class="btn" type="button" onclick="window.print()">Print or save</button></div>');
    } else {
      var st2 = d.status === 'active' ? (d.expires_on && d.expires_on < new Date().toISOString().slice(0, 10) ? '<span class="pill bad">Ran out ' + esc(day(d.expires_on)) + '</span>' : '<span class="pill ok">' + money(d.balance_pence) + ' left to spend</span>') : '<span class="pill bad">' + (d.status === 'used' ? 'All used' : 'Cancelled') + '</span>';
      document.title = 'Gift voucher · MD Dance Academy';
      show('<div class="kind">Gift voucher</div><div class="big" style="margin-top:8px">' + money(d.value_pence) + '</div>' + (d.for_name ? '<h1>For ' + esc(d.for_name) + '</h1>' : '') + '</div><div class="tear"></div><div class="body">' + (d.message ? '<p class="msg">“' + esc(d.message) + '”' + (d.from_name ? '<br>from ' + esc(d.from_name) : '') + '</p>' : d.from_name ? '<p class="msg">From ' + esc(d.from_name) + '</p>' : '') +
        '<div id="qr">' + qr('MDV:' + d.code) + '</div><div class="code">' + esc(d.code) + '</div>' + st2 + (d.expires_on ? '<p class="small">Use by ' + esc(day(d.expires_on)) + ' for classes, private lessons or the shop. Show this or quote the code.</p>' : '') + '<button class="btn" type="button" onclick="window.print()">Print or save</button></div>');
    }
  })
  .catch(function(){ show('</div><div class="empty">No signal right now. Try again when you’re back online.</div>'); });
})();
</script>
</body>
</html>
