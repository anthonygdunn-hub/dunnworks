<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD Dance Academy parents</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D81B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MD Dance">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--red:#D81B2C;--red-d:#B0111F;--pink:#FF3D8B;--ink:#2B2B2E;--ink2:#4A4A4F;--ink3:#66666C;--bg:#FFF7F8;--card:#fff;--blush:#FFF0F4;--line:#F6D3DC;--ok:#1E6B43;--ok-l:#E3F3EA;--warn:#8A5A00;--warn-l:#FFF3D6;--bad:#B0111F;--bad-l:#FDE4E8;--r:16px;--display:'Cinzel',Georgia,serif;--ui:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-d)}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.15}
h1{font:700 1.6rem/1.1 var(--display);letter-spacing:.03em}
h2{font:700 1.15rem/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase}
h3{font-weight:600;font-size:1.05rem}
p{margin:0}
.muted{color:var(--ink3)}
.small{font-size:14px}
.hide{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(150deg,#C8102E 0%,#D6136F 60%,#FF3D8B 100%)}
.login .box{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 30px 60px -20px rgba(60,6,20,.5);display:flex;flex-direction:column;gap:14px}
.login img{width:260px;max-width:82%;height:auto;margin:0 auto 4px;display:block}
.login h1{text-align:center;font-size:1.25rem}
.login .btn{white-space:normal;text-align:center;line-height:1.25;padding-top:10px;padding-bottom:10px}
.login .box{min-width:0}
.linkbtn{background:none;border:0;color:var(--red,#D81B2C);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:6px;align-self:center;min-height:44px}

/* shell */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#D81B2C,#FF3D8B,#D81B2C) 1}
.top .bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px}
.top img{height:40px;width:auto;display:block}
.top .who{margin-left:auto;text-align:right;line-height:1.2}
.top .who b{display:block;font-size:15px}
.top .who span{font-size:12.5px;color:var(--ink3)}
.wrap{max-width:1200px;margin:0 auto;display:flex;gap:24px;padding:20px 16px 110px}
.side{flex:none;width:220px;position:sticky;top:88px;align-self:flex-start;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;font-weight:500}
.side button:hover{background:var(--blush)}
.side button[aria-current="page"]{background:var(--ink);color:#fff}
.side .i{width:20px;height:20px}
.cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font:600 12px/22px var(--ui);text-align:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.tabbar{display:none}
@media (max-width:860px){
  .side{display:none}
  .wrap{padding:16px 12px calc(96px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border:0;background:none;font-size:11.5px;font-weight:500;color:var(--ink3);cursor:pointer;border-radius:12px}
  .tabbar button[aria-current="page"]{color:var(--red)}
  .tabbar .i{width:24px;height:24px}
  .tabbar .cnt{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;line-height:18px;font-size:11px}
  .top .who span{display:none}
  h1{font-size:1.35rem}
}
.i{display:block;flex:none;width:20px;height:20px}
.alert .i,.pill .i{width:15px;height:15px}
.item>summary>.i{color:var(--ink3)}

/* parts */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.stat{display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.stat b{font:700 1.9rem/1 var(--display)}
.stat span{font-size:14px;color:var(--ink3)}
.stat.hot{background:linear-gradient(135deg,#C8102E,#D6136F);border:0;color:#fff}
.stat.hot span{color:#FFE3EE}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;background:var(--red);color:#fff;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--red-d);color:#fff}
.btn.line{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--ink);color:#fff}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--blush)}
.btn.dark{background:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:wait}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--blush);color:#8E1230;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.bad{background:var(--bad-l);color:var(--bad)}
.pill.grey{background:#EFEFF1;color:#55555B}
.pill.demo{background:#EEE8FF;color:#4B2C9E}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item>summary,.item .sum{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.item>summary::-webkit-details-marker{display:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t small{display:block;color:var(--ink3);font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.item .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.item[open]{border-color:var(--pink)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;word-break:break-word}
.alert{display:inline-flex;align-items:center;gap:6px;color:var(--bad);font-weight:600;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
.field .hint{font-weight:400;color:var(--ink3);font-size:13px}
.in,select.in,textarea.in{width:100%;min-height:46px;border:1px solid #E8B4C0;border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
textarea.in{padding:10px 12px;min-height:84px;resize:vertical}
.in:focus{outline:3px solid var(--pink);outline-offset:0;border-color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;font-size:15px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--red)}
.empty{padding:28px 16px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;border-radius:var(--r);background:#EEE8FF;color:#3A2280;font-size:15px}
.search{position:relative}
.search .in{padding-left:40px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3)}

/* register */
.reg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.reg:last-child{border-bottom:0}
.reg .t{flex:1;min-width:0}
.tog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.tog button{min-width:58px;min-height:42px;border:0;background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.tog button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.tog button[aria-pressed="true"].n{background:var(--bad);color:#fff}
.regfoot{position:sticky;bottom:76px;z-index:5}
@media (min-width:861px){.regfoot{bottom:12px}}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--blush);font-weight:600;font-size:13.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}

/* dialog */
dialog{border:0;padding:0;border-radius:22px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 30px 70px -20px rgba(43,43,46,.55)}
dialog::backdrop{background:rgba(43,43,46,.5)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:22px 20px}
dialog .dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}
@media (max-width:600px){dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh}}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,150%);visibility:hidden;z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;transition:transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast.err{background:var(--bad)}
@media (min-width:861px){.toast{bottom:24px}}
.loading{padding:60px 16px;text-align:center;color:var(--ink3)}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--warn-l);color:var(--warn);white-space:nowrap}
.sync[hidden]{display:none}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.side .set{font-size:14px;min-height:40px;color:var(--ink2)}
html.text-lg main,html.text-lg dialog form{zoom:1.12}
html.text-xl main,html.text-xl dialog form{zoom:1.25}
.ts{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:inherit}
.ts b{font-family:var(--display);width:44px}
.ts[aria-pressed="true"]{border:2px solid var(--red)}
.isteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.isteps li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.isteps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700}
.ihead{display:flex;align-items:center;gap:12px}
.ihead img{width:56px;height:56px;border-radius:14px}
.installcard{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.installcard img{width:44px;height:44px;border-radius:12px}
.settings{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}


/* timetable */
.ttbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ttbar .lab{font:700 1.05rem/1.2 var(--display);letter-spacing:.02em;min-width:150px;text-align:center}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daystrip button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-size:12px;color:var(--ink3);padding:4px 0}
.daystrip button b{font:700 1.15rem/1 var(--display);color:var(--ink)}
.daystrip button span.n{font-size:11px;font-weight:600;color:var(--red)}
.daystrip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.daystrip button[aria-pressed="true"] b,.daystrip button[aria-pressed="true"] span.n{color:#fff}
.daystrip button.today b{text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:4px;text-decoration-thickness:3px}
.les{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:inherit;color:inherit;position:relative;overflow:hidden}
.les::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.les:hover{border-color:var(--pink)}
.les .tm{font-weight:700;font-size:15px;line-height:1.25;padding-left:4px}
.les .tm small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.les .who{font-weight:600}
.les .meta{font-size:13.5px;color:var(--ink3)}
.les.cancel{opacity:.6}
.les.cancel .who{text-decoration:line-through}
.les.grp{background:#F6F6F7;cursor:default;border-style:dashed}
.les.grp::before{background:#B9B9C0}
.coachpill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.week .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.week .dh{display:flex;align-items:baseline;justify-content:space-between;gap:4px;padding:6px 8px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;text-align:left}
.week .dh b{font:700 1rem var(--display)}
.week .dh.today{background:var(--ink);color:#fff;border-color:var(--ink)}
.week .les{grid-template-columns:1fr;gap:2px;padding:8px 8px 8px 12px;font-size:13px}
.week .les .tm{font-size:12.5px;padding-left:0}
.week .les .meta{font-size:12px}
.week .les .right{display:none}
@media (max-width:600px){.les{grid-template-columns:64px minmax(0,1fr);gap:4px 10px}.les .right{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;text-align:left!important}.les .right div{margin:0!important}.daystrip{gap:4px}.daystrip button{min-height:54px}}
@media (max-width:1100px){.week{grid-template-columns:1fr}.week .les{grid-template-columns:88px minmax(0,1fr);font-size:15px}.week .les .tm{font-size:14px}}
.pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.pick label{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid #F7E3E8;font-size:15px}
.pick label:last-child{border-bottom:0}
.pick input{width:20px;height:20px;accent-color:var(--red);flex:none}
.pick small{color:var(--ink3);margin-left:auto;font-size:12.5px;text-align:right}
.warn{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.lens{display:flex;gap:6px;flex-wrap:wrap}


/* parent app */
.wrap{max-width:720px;display:block;padding:20px 16px calc(100px + env(safe-area-inset-bottom))}
main{gap:18px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border:0;background:none;font-size:12px;font-weight:500;color:var(--ink3);cursor:pointer;border-radius:12px}
.tabbar button[aria-current="page"]{color:var(--red)}
.tabbar .i{width:24px;height:24px}
.tabbar .cnt{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;line-height:18px;font-size:11px}
@media (min-width:861px){
  .tabbar{position:sticky;top:67px;bottom:auto;max-width:720px;margin:0 auto;border:0;background:var(--bg);padding:14px 16px 0;grid-template-columns:repeat(5,auto);justify-content:start;gap:6px}
  .tabbar button{flex-direction:row;gap:8px;min-height:42px;padding:0 14px;font-size:15px;border-radius:999px;background:#fff;border:1px solid var(--line)}
  .tabbar button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabbar .i{width:18px;height:18px}
  .tabbar .cnt{position:static}
  .wrap{padding-bottom:40px}
}
.hello h1{font-size:1.5rem}
.bal{display:flex;flex-direction:column;gap:4px;border-radius:20px;padding:18px 20px;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.bal.owe{background:linear-gradient(135deg,#C8102E,#D6136F);color:#fff}
.bal.owe .lbl,.bal.owe .sub{color:#FFE3EE}
.bal.paid{background:var(--ok-l);color:var(--ok)}
.bal .lbl{font-size:14px;font-weight:600;letter-spacing:.02em}
.bal .amt{font:700 2.4rem/1.05 var(--display)}
.bal .sub{font-size:14px;color:var(--ink2)}
.up{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.up::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,var(--red))}
.up .dt{text-align:center;line-height:1.1;padding-left:4px}
.up .dt small{display:block;font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.up .dt b{font:700 1.5rem/1 var(--display)}
.up .t b{display:block;font-weight:600}
.up .t span{display:block;font-size:14px;color:var(--ink3)}
.up.grp{--c:#B9B9C0}
.up.ev{--c:#7A3FD1}
.up.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#F3EDFF;color:#3A2280;border-radius:var(--r);padding:14px 16px}
.callout b{display:block}
.stmt{display:flex;flex-direction:column}
.stmt .r{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.stmt .r:last-child{border-bottom:0}
.stmt .r .t{flex:1;min-width:0}
.stmt .r .t small{display:block;color:var(--ink3);font-size:13px}
.stmt .r .a{font-weight:600;white-space:nowrap}
.stmt .r .a.pos{color:var(--ok)}
.top .bar{max-width:720px}
.evc{display:flex;flex-direction:column;gap:10px}
.evc .when{font-size:14px;color:var(--ink3)}
.enter{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--blush)}
.enter b{font-weight:600}
.kidcard{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{min-height:42px;min-width:72px;border:0;background:#fff;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>h2{font-size:1rem}
</style>

  h += balCard();
  var invite = openEvents().filter(function(e){ return notEntered(e).length; });
  if (invite.length) h += '<div class="callout"><div><b>' + esc(invite[0].title) + '</b><span class="small">' + esc(dshort(invite[0].starts_on)) + ' · open for entries' + (invite.length > 1 ? ', plus ' + (invite.length - 1) + ' more' : '') + '</span></div><button class="btn sm dark" type="button" data-go="events">Enter now</button></div>';
  var up = upcoming(14);
  h += '<section class="sect"><h2>Next two weeks</h2>' + (up.length ? up.slice(0, 8).map(upRow).join('') + (up.length > 8 ? '<button class="btn ghost" type="button" data-go="timetable">See everything</button>' : '') : '<div class="empty">Nothing booked in the next two weeks.</div>') + '</section>';
  return h;
};
function balCard(){
  var b = S.d.balance;
  return b > 0
    ? '<button class="bal owe" type="button" data-go="fees"><span class="lbl">To pay</span><span class="amt">' + money(b) + '</span><span class="sub">Pay at your next class, or ask us for bank transfer details. Tap to see what it’s for.</span></button>'
    : '<button class="bal paid" type="button" data-go="fees"><span class="lbl">' + (b < 0 ? money(b) + ' in credit' : 'All paid up') + '</span><span class="sub">Thank you, nothing to pay right now.</span></button>';
}
V.timetable = function(){
  var h = '<div class="head"><div><h1>Timetable</h1><p class="muted">Weekly classes, and private or pair lessons booked.</p></div></div>';
  var cg = classGroups();
  h += '<section class="sect"><h2>Every week</h2>' + (cg.length ? cg.map(function(c){ return '<div class="up grp"><div class="dt"><small>' + DAYS[c.day].slice(0, 3) + '</small><b style="font-size:1.05rem">' + t12(c.starts) + '</b></div><div class="t"><b>' + esc(c.name) + '</b><span>' + esc(c.who.join(' & ')) + ' · until ' + t12(c.ends) + (c.coach ? ' · with ' + esc(c.coach) : '') + (c.venue ? ' · ' + esc(c.venue) : '') + '</span></div></div>'; }).join('') : '<div class="empty">Not in a weekly class yet.</div>') + '</section>';
  var today = S.d.today, les = (S.d.lessons || []);
  var next = les.filter(function(l){ return l.on_date >= today; }), past = les.filter(function(l){ return l.on_date < today; }).reverse();
  var lrow = function(l){ return upRow({ on: l.on_date, kind: 'lesson', title: (l.dancers || []).join(' & ') + '’s lesson', sub: t12(l.starts) + '–' + t12(l.ends) + (l.coach ? ' with ' + l.coach : '') + (l.venue ? ' · ' + l.venue : '') }); };
  h += '<section class="sect"><h2>Lessons booked</h2>' + (next.length ? next.map(lrow).join('') : '<div class="empty">No private or pair lessons booked. Ask your coach to book one.</div>') + '</section>';
  if (past.length) h += '<details class="item"><summary><div class="t"><b>Last two weeks</b><small>' + past.length + ' lesson' + (past.length > 1 ? 's' : '') + '</small></div></summary><div class="body">' + past.map(lrow).join('') + '</div></details>';
  h += '<p class="small muted">Need to change or cancel a lesson? Call or message your coach, or 07810 208765.</p>';
  return h;
};
V.fees = function(){
  var rows = (S.d.charges || []).map(function(c){ return { on: c.on, t: c.label, s: c.dancer || '', p: -c.pence }; })
    .concat((S.d.payments || []).map(function(p){ return { on: p.on, t: 'Payment, thank you', s: p.method ? ({ transfer: 'Bank transfer', cash: 'Cash', card: 'Card' }[p.method] || p.method) : '', p: p.pence }; }))
    .sort(function(a, b){ return b.on.localeCompare(a.on); });
  var h = '<div class="head"><div><h1>Fees</h1><p class="muted">Everything charged and paid.</p></div></div>' + balCard();
  h += '<section class="card"><div class="stmt">' + (rows.length ? rows.map(function(r){ return '<div class="r"><div class="t"><b>' + esc(r.t) + '</b><small>' + esc(dshort(r.on)) + (r.s ? ' · ' + esc(r.s) : '') + '</small></div><span class="a ' + (r.p > 0 ? 'pos' : '') + '">' + (r.p > 0 ? '+' : '') + money(r.p) + '</span></div>'; }).join('') : '<p class="muted">Nothing yet.</p>') + '</div></section>';
  h += '<p class="small muted">Lessons are added on the day they happen. Something not right? Call 07810 208765.</p>';
  return h;
};
V.events = function(){
  var ev = (S.d.events || []).filter(function(e){ return (e.ends_on || e.starts_on) >= S.d.today; });
  var h = '<div class="head"><div><h1>Events</h1><p class="muted">Competitions, medals, shows and term dates.</p></div></div>';
  if (!ev.length) return h + '<div class="empty">No events coming up.</div>';
  return h + ev.map(function(e){
    var inner = '';
    if (e.kind !== 'Term') inner = kids().map(function(k){
      var en = (e.entries || []).find(function(x){ return x.dancer_id === k.id; }), st = en ? en.status : null;
      var label = st === 'paid' ? '<span class="pill ok">Entered and paid</span>' : st === 'entered' ? '<span class="pill ok">Entered</span>' : '<span class="pill grey">Not entered</span>';
      var act = !e.open ? '' : st === 'entered' ? '<button class="btn ghost sm" type="button" data-enter="0" data-ev="' + e.id + '" data-k="' + k.id + '">Withdraw</button>' : st === 'paid' ? '' : '<button class="btn sm" type="button" data-enter="1" data-ev="' + e.id + '" data-k="' + k.id + '">Enter ' + esc(k.first_name) + '</button>';
      return '<div class="enter"><div><b>' + esc(k.first_name) + '</b> ' + label + '</div>' + act + '</div>';
    }).join('');
    return '<section class="card evc"><div class="row between"><span class="pill ' + (e.open ? 'demo' : 'grey') + '">' + esc(e.open ? e.kind + ' · open for entries' : e.kind) + '</span></div><h3>' + esc(e.title) + '</h3><p class="when">' + esc(dshort(e.starts_on) + (e.ends_on && e.ends_on !== e.starts_on ? ' to ' + dshort(e.ends_on) : '') + (e.time_label ? ', ' + e.time_label : '') + (e.venue ? ' · ' + e.venue : '')) + '</p>' + (e.details ? '<p class="small">' + esc(e.details) + '</p>' : '') + inner + (e.kind !== 'Term' && !e.open ? '<p class="small muted">Entries are handled by MD for this one. Ask at class.</p>' : '') + '</section>';
  }).join('');
};
V.details = function(){
  var f = S.d.families[0];
  var h = '<div class="head"><div><h1>Your details</h1><p class="muted">Keep these up to date so we can reach you.</p></div></div>';
  h += '<form class="card stack" id="detForm"><div class="fgrid"><label class="field">Your name<input class="in" name="parent_name" value="' + esc(f.parent_name) + '" required maxlength="120"></label><label class="field">Mobile<input class="in" type="tel" name="phone" value="' + esc(f.phone) + '" required maxlength="40"></label><label class="field full">Email<span class="hint">This is your log in. To change it, call 07810 208765.</span><input class="in" value="' + esc(f.email) + '" disabled></label></div>';
  h += kids().map(function(k){ return '<div class="kidcard" data-kid="' + k.id + '"><h3>' + esc(k.first_name + ' ' + (k.last_name || '')) + (k.level ? ' <span class="pill">' + esc(k.level) + '</span>' : '') + '</h3><label class="field">Medical needs or allergies<span class="hint">Leave empty if none. Your coach can see this.</span><textarea class="in" name="medical" maxlength="1000">' + esc(k.medical || '') + '</textarea></label><div class="row between"><span class="small">Photos and videos of ' + esc(k.first_name) + ' on our website and social media</span><span class="seg" role="group"><button type="button" data-photo="1" aria-pressed="' + (k.photo_ok !== false) + '">Yes</button><button type="button" data-photo="0" aria-pressed="' + (k.photo_ok === false) + '">No</button></span></div></div>'; }).join('');
  h += '<button class="btn" type="submit">Save my details</button></form>';
  h += '<section class="card stack"><h3>Your log in</h3><div class="row"><button class="btn line sm" type="button" data-pw>Change my password</button><button class="btn ghost sm" type="button" data-signout>Log out</button></div></section>';
  h += '<p class="small muted">MD Dance Academy, Bordon · 07810 208765</p>';
  return h;
};

/* ---------------- shell */
function drawNav(){
  var n = openEvents().filter(function(e){ return notEntered(e).length; }).length;
  $('#tabbar').innerHTML = NAV.map(function(x){ return '<button type="button" data-go="' + x[0] + '"' + (S.view === x[0] ? ' aria-current="page"' : '') + '>' + ic(x[2]) + '<span>' + x[1] + '</span>' + (x[0] === 'events' && n ? '<span class="cnt">' + n + '</span>' : '') + '</button>'; }).join('');
}
function render(){
  if (!V[S.view]) S.view = 'home';
  drawNav();
  $('#main').innerHTML = V[S.view]();
}
function go(v){ S.view = v; try { history.replaceState(null, '', '#' + v); } catch (e) {} render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (S.d && V[h] && h !== S.view) { S.view = h; render(); window.scrollTo(0, 0); } });

var dlg = $('#dlg'), dlgForm = $('#dlgForm'), dlgSubmit = null;
function openDlg(title, body, label, onSubmit){
  dlgSubmit = onSubmit;
  dlgForm.innerHTML = '<div class="dh"><h2>' + esc(title) + '</h2><button class="x" type="button" data-close aria-label="Close">' + ic('x') + '</button></div>' + body + '<div class="row"><button class="btn" type="submit">' + esc(label) + '</button><button class="btn ghost" type="button" data-close>Cancel</button></div>';
  dlg.showModal();
}
dlgForm.addEventListener('submit', async function(e){ e.preventDefault(); if (!dlgSubmit) return dlg.close(); var b = dlgForm.querySelector('button[type=submit]'); b.disabled = true; try { var ok = await dlgSubmit(new FormData(dlgForm)); if (ok !== false) dlg.close(); } finally { b.disabled = false; } });
var errText = function(e){ var m = String(e && e.message || e || ''); return /closed|paid for|speak to MD/i.test(m) ? m : 'That didn’t work. Please try again, or call 07810 208765.'; };

document.addEventListener('click', async function(e){
  var t;
  if ((t = e.target.closest('[data-close]'))) { dlg.close(); return; }
  if ((t = e.target.closest('[data-go]'))) { e.preventDefault(); go(t.dataset.go); return; }
  if ((t = e.target.closest('[data-photo]'))) { t.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); return; }
  if ((t = e.target.closest('[data-enter]'))) {
    var enter = t.dataset.enter === '1', ev = (S.d.events || []).find(function(x){ return x.id === t.dataset.ev; }), k = kidName(t.dataset.k);
    var doIt = async function(){
      var r = await sb.rpc('md_parent_enter', { p_event: t.dataset.ev, p_dancer: t.dataset.k, p_enter: enter });
      if (r.error) { toast(errText(r.error), true); return false; }
      try { sb.functions.invoke('md-push', { body: { kind: 'parent', action: 'entry', event_id: t.dataset.ev, dancer_id: t.dataset.k, enter: enter } }); } catch (x) {}
      await load(); render(); toast(enter ? k + ' is entered. MD will be in touch about fees.' : k + ' has been withdrawn');
    };
    if (enter) { t.disabled = true; await doIt(); t.disabled = false; }
    else openDlg('Withdraw ' + k + '?', '<p>' + esc(k) + ' will come off the list for <b>' + esc(ev.title) + '</b>. You can enter again while entries are open.</p>', 'Withdraw', doIt);
    return;
  }
  if (e.target.closest('[data-signout]')) { await sb.auth.signOut(); S = { view: 'home', d: null }; start(null); return; }
  if (e.target.closest('[data-pw]')) {
    openDlg('Change my password', '<label class="field">New password<span class="hint">At least 10 characters</span><input class="in" type="password" name="pw" minlength="10" required autocomplete="new-password"></label><label class="field">Type it again<input class="in" type="password" name="pw2" minlength="10" required autocomplete="new-password"></label>', 'Save password', async function(fd){
      if (fd.get('pw') !== fd.get('pw2')) { toast('Those two passwords don’t match', true); return false; }
      var r = await sb.auth.updateUser({ password: fd.get('pw') });
      if (r.error) { toast('Couldn’t change it. Use “forgotten your password” on the log in page instead.', true); return false; }
      toast('Password changed');
    });
  }
});
document.addEventListener('submit', async function(e){
  if (e.target.id !== 'detForm') return;
  e.preventDefault();
  var f = e.target, b = f.querySelector('button[type=submit]');
  var body = { family_id: S.d.families[0].id, parent_name: f.parent_name.value, phone: f.phone.value, dancers: Array.prototype.map.call(f.querySelectorAll('[data-kid]'), function(k){ return { id: k.dataset.kid, medical: k.querySelector('textarea').value, photo_ok: k.querySelector('[data-photo="1"]').getAttribute('aria-pressed') === 'true' }; }) };
  b.disabled = true;
  var r = await sb.rpc('md_parent_update', { p: body });
  b.disabled = false;
  if (r.error) return toast(errText(r.error), true);
  try { sb.functions.invoke('md-push', { body: { kind: 'parent', action: 'details' } }); } catch (x) {}
  await load(); $('#meName').textContent = S.d.families[0].parent_name; render(); toast('Saved. Thank you');
});

/* ---------------- log in */
function loginPane(id){ ['loginForm', 'forgotForm', 'resetForm'].forEach(function(f){ $('#' + f).classList.toggle('hide', f !== id); }); }
function showLogin(msg, bad){ $('#app').classList.add('hide'); $('#login').classList.remove('hide'); if (msg != null) { $('#loginMsg').textContent = msg; $('#loginMsg').style.color = bad ? 'var(--bad)' : ''; } }
async function start(session){
  if (!session) return showLogin();
  var d;
  try { d = await load(); } catch (e) { d = undefined; }
  if (d === undefined) { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#main').innerHTML = '<div class="empty">' + (navigator.onLine ? 'Couldn’t load your details. Please try again shortly.' : 'No signal right now. Try again when you’re back online.') + '</div>'; return; }
  if (!d) { var staff = false; try { var st = await sb.rpc('md_is_staff'); staff = st.data === true; } catch (x) {} await sb.auth.signOut(); showLogin(staff ? '' : 'We can’t find a family linked to this log in. Call 07810 208765 and we’ll sort it.', true); if (staff) $('#loginMsg').innerHTML = 'That’s a staff log in. <a href="../staff/">Open the staff app</a> instead.'; return; }
  $('#meName').textContent = d.families[0].parent_name;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  var h = (location.hash || '').slice(1); if (V[h]) S.view = h;
  render();
}
$('#loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var f = e.target, b = f.querySelector('button[type=submit]'); b.disabled = true;
  var r = await sb.auth.signInWithPassword({ email: f.email.value.trim().toLowerCase(), password: f.pw.value });
  b.disabled = false;
  if (r.error) return showLogin('That email and password didn’t match. First time here? Tap the button below to get a link.', true);
  f.pw.value = ''; $('#loginMsg').textContent = ''; start(r.data.session);
});
var resetToken = (location.hash.match(/^#reset=([0-9a-f]{64})$/) || [])[1] || null;
if (resetToken) history.replaceState(null, '', location.pathname);
document.addEventListener('click', function(e){
  if (e.target.closest('[data-forgot]')) { $('#forgotForm').email.value = $('#loginForm').email.value; loginPane('forgotForm'); }
  if (e.target.closest('[data-backlogin]')) { resetToken = null; loginPane('loginForm'); }
});
$('#forgotForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var f = e.target, b = f.querySelector('button[type=submit]'); b.disabled = true;
  try { await sb.functions.invoke('md-reset', { body: { action: 'request', app: 'parent', email: f.email.value.trim().toLowerCase() } }); } catch (err) {}
  b.disabled = false;
  $('#forgotMsg').innerHTML = '<b>Check your email.</b> If we have that address for your family, a link is on its way. It works for one hour. Nothing arrived? Check your junk folder, or call 07810 208765.';
});
$('#resetForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var f = e.target, b = f.querySelector('button[type=submit]'), m = $('#resetMsg');
  if (f.pw.value !== f.pw2.value) { m.textContent = 'Those two passwords don’t match.'; m.style.color = 'var(--bad)'; return; }
  b.disabled = true; m.style.color = ''; m.textContent = 'Saving…';
  var r; try { r = await sb.functions.invoke('md-reset', { body: { action: 'set', token: resetToken, password: f.pw.value } }); } catch (err) { r = { error: err }; }
  var d = r && r.data;
  if (!d || !d.ok) {
    b.disabled = false; var msg = 'That link has expired or already been used. Ask for a new one.';
    try { if (r.error && r.error.context && r.error.context.json) { var j = await r.error.context.json(); if (j.error) msg = j.error; } } catch (x) {}
    m.textContent = msg; m.style.color = 'var(--bad)'; return;
  }
  resetToken = null; toast('Password saved');
  if (d.email) { var s = await sb.auth.signInWithPassword({ email: d.email, password: f.pw.value }); f.reset(); b.disabled = false; if (!s.error) { loginPane('loginForm'); return start(s.data.session); } }
  b.disabled = false; f.reset(); loginPane('loginForm'); showLogin('Password saved. Log in with it now.');
});
if (resetToken) { sb.auth.signOut().catch(function(){}); showLogin(); loginPane('resetForm'); }
else sb.auth.getSession().then(function(r){ start(r.data.session); });
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && S.d) load().then(render).catch(function(){}); });
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
</body>
</html>
