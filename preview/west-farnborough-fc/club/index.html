<style>
:root{--ink:#0e0909;--ink2:#170d0d;--ink3:#211313;--ink4:#2b1818;--line:#3a2020;--red:#9b1b1b;--red2:#c22a2a;--red-deep:#4c0b0b;
  --gold:#dcae72;--gold2:#f0cf9c;--cream:#f4e9da;--txt2:#c7b4a3;--txt3:#8d7767;--ok:#3fae6a;--maybe:#d9a441;--no:#c94040;
  --d:'Oswald','Arial Narrow',Impact,sans-serif;--f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--f);line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(800px 360px at 50% -120px,rgba(155,27,27,.35),transparent 70%);min-height:100dvh}
a{color:var(--gold)}
h1,h2,h3,.disp{font-family:var(--d);text-transform:uppercase;line-height:1.08;margin:0;letter-spacing:.01em}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:30;background:rgba(14,9,9,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.top img{width:36px;height:36px}
.top b{font-family:var(--d);text-transform:uppercase;font-size:1.05rem;line-height:1}
.top small{display:block;color:var(--gold);font-family:var(--d);text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;margin-top:2px}
.top .who{margin-left:auto;font-size:.78rem;color:var(--txt2);text-align:right}
.top .who span{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--red-deep);color:var(--gold2);font-weight:700;text-transform:capitalize;font-size:.7rem}
main{padding:18px 0 calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.kicker{font-family:var(--d);text-transform:uppercase;color:var(--gold);letter-spacing:.14em;font-size:.74rem;font-weight:600}
.h{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:6px 0 14px}
.h h2{font-size:1.9rem}
.muted{color:var(--txt3);font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*,.grid3>*{min-width:0}
input[type=datetime-local],input[type=date]{min-width:0;max-width:100%}
@media(max-width:520px){.grid2.dt{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:700px){.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}}
@media(max-width:699px){.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.stat{background:var(--ink3);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--d);font-size:1.7rem;line-height:1.1}
.stat span{font-size:.72rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em}
.stat.bad b{color:#ff8f8f}.stat.good b{color:#7fd8a0}
button,.btn{font:inherit;font-weight:700;font-size:.88rem;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink3);color:var(--cream);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{filter:brightness(1.15)}
button.pri,.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:#1a0d06}
button.sm{padding:6px 10px;font-size:.78rem;border-radius:8px}
button.ghost{background:none}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--cream);background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold)}
label{display:block;font-size:.76rem;font-weight:700;color:var(--txt2);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.msg{font-size:.86rem;margin-top:10px;min-height:1.2em}.msg.bad{color:#ff8f8f}.msg.ok{color:#7fd8a0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ink3);border:1px solid var(--line);color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
.pill.match{background:var(--red-deep);color:var(--gold2);border-color:#6b1515}
.pill.training{background:#14233a;color:#9cc0ff;border-color:#24406b}
.pill.event,.pill.meeting{background:#2d2410;color:var(--gold2);border-color:#5a4516}
.ev{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;cursor:pointer}
.ev .d{text-align:center;font-family:var(--d);text-transform:uppercase;line-height:1;background:var(--ink3);border-radius:10px;padding:8px 0}
.ev .d b{display:block;font-size:1.5rem}.ev .d span{font-size:.68rem;color:var(--gold);letter-spacing:.08em}
.ev h3{font-size:1.15rem;margin:4px 0 2px}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.rsvp button{padding:9px 6px;font-size:.82rem}
.rsvp button[data-on="yes"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.rsvp button[data-on="maybe"].on{background:var(--maybe);border-color:var(--maybe);color:#1a1005}
.rsvp button[data-on="no"].on{background:var(--no);border-color:var(--no);color:#fff}
.counts{display:flex;gap:10px;font-size:.78rem;color:var(--txt3);margin-top:8px}
.counts i{font-style:normal;font-weight:700}.counts .y{color:#7fd8a0}.counts .m{color:var(--maybe)}.counts .n{color:#ff8f8f}
.score{font-family:var(--d);font-size:1.3rem;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-family:var(--d);text-transform:uppercase;font-weight:500;letter-spacing:.06em;color:var(--txt3);font-size:.72rem;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid rgba(58,32,32,.55);vertical-align:middle}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.seg{display:flex;gap:4px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;margin-bottom:14px}
.seg button{border:0;background:none;color:var(--txt2);padding:8px 12px;white-space:nowrap;font-size:.82rem}
.seg button.on{background:var(--red);color:#fff}
.list-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.list-names span{font-size:.8rem;padding:4px 9px;border-radius:999px;background:var(--ink3);border:1px solid var(--line)}
.stats-l{display:flex;flex-wrap:wrap;gap:6px}
.stats-l span{font-size:.8rem;padding:4px 6px 4px 10px;border-radius:999px;background:var(--ink3);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.stats-l button{padding:0 6px;border:0;background:none;color:var(--txt3);font-size:1rem}
.banner{padding:14px 16px;border-radius:12px;background:linear-gradient(120deg,var(--red),var(--red-deep));display:flex;align-items:center;gap:12px;margin-bottom:12px}
.banner b{font-family:var(--d);font-size:1.5rem}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,10,10,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;max-width:620px;margin:0 auto}
.nav button{flex:1;display:grid;justify-items:center;gap:3px;padding:9px 0 8px;border:0;border-radius:0;background:none;color:var(--txt3);font-size:.66rem;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}
.auth{max-width:420px;margin:7vh auto 0;padding:0 16px}
.auth .crest{width:130px;margin:0 auto 14px;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6))}
.auth h1{text-align:center;font-size:1.9rem}
.auth p.sub{text-align:center;color:var(--txt2);margin:4px 0 18px}
dialog{border:1px solid var(--line);background:var(--ink2);color:var(--cream);border-radius:16px;padding:0;width:min(560px,94vw);max-height:90dvh}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink2);z-index:1}
dialog .dh h3{font-size:1.3rem}
dialog .db{padding:4px 16px 18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink4);border:1px solid var(--gold);color:var(--cream);padding:10px 16px;border-radius:10px;font-size:.86rem;font-weight:600;z-index:100;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--txt2);padding:20px 10px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-top:10px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--cream)}
.check input{width:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

const sb = supabase.createClient(DW.url, DW.anonKey, { auth: { storageKey: 'wfc-club', persistSession: true } });
const $ = s => document.querySelector(s);
const root = $('#root'), dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = p => (p < 0 ? '−' : '') + '£' + (Math.abs(p || 0) / 100).toFixed(2);
const toPence = v => Math.round(parseFloat(String(v).replace(/[£,\s]/g, '')) * 100) || 0;
const D = s => new Date(s);
const fDay = d => D(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fTime = d => D(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const fDate = d => d ? D(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const localInput = d => { const x = D(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); }
function openDlg(title, html) { $('#dlgT').textContent = title; $('#dlgB').innerHTML = html; dlg.showModal(); }
async function run(p, okMsg) { const { data, error } = await p; if (error) { toast(error.message); throw error; } if (okMsg) toast(okMsg); return data; }

const STAFF = ['admin','committee','manager','coach'];
const MONEY_READ = ['admin','committee','treasurer','manager'];
const MONEY_WRITE = ['admin','treasurer'];
const STAT_KINDS = { goal: '⚽ Goal', assist: '🅰️ Assist', yellow: '🟨 Yellow', red: '🟥 Red', pen_scored: '✅ Pen scored', pen_missed: '❌ Pen missed', pen_saved: '🧤 Pen saved', own_goal: '🙈 Own goal', motm: '⭐ MOTM', clean_sheet: '🧱 Clean sheet' };
const CATS_IN = ['sponsorship','player fees','fundraising','grant','social','other'];
const CATS_OUT = ['pitch hire','referee','league fees','kit','equipment','first aid','social','travel','other'];
const CHARGE_KINDS = { signing_on: 'Signing-on fee', match_fee: 'Matchday fee', training: 'Training fee', subs: 'Subs', fine: 'Fine', kit: 'Kit', other: 'Other' };

let S = { role: null, me: null, tab: 'home', events: [], rsvps: [], stats: [], roster: [], settings: {} };
const can = roles => roles.includes(S.role);

/* ---------- auth ---------- */
function authView(mode = 'in', msg = '') {
  root.innerHTML = `<div class="auth">
    <img class="crest" src="${CREST}" alt="West Farnborough FC crest">
    <h1>Club hub</h1><p class="sub">West Farnborough FC · players, coaches, committee</p>
    <div class="seg"><button class="${mode==='in'?'on':''}" data-m="in">Sign in</button><button class="${mode==='up'?'on':''}" data-m="up">Join the club</button><button class="${mode==='reset'?'on':''}" data-m="reset">Forgot password</button></div>
    <form class="card" id="af">
      ${mode === 'up' ? `<label for="an">Full name</label><input id="an" required autocomplete="name">
        <div class="grid2"><div><label for="ak">Nickname</label><input id="ak" placeholder="What the lads call you"></div>
        <div><label for="ap">Mobile</label><input id="ap" type="tel" autocomplete="tel"></div></div>` : ''}
      <label for="ae">Email</label><input id="ae" type="email" required autocomplete="email">
      ${mode !== 'reset' ? `<label for="aw">Password</label><input id="aw" type="password" required minlength="8" autocomplete="${mode==='up'?'new-password':'current-password'}">` : ''}
      <button class="pri" style="width:100%;margin-top:16px" type="submit">${mode==='in'?'Sign in':mode==='up'?'Create my login':'Send reset link'}</button>
      <div class="msg ${msg.startsWith('!')?'bad':'ok'}" id="am">${esc(msg.replace(/^!/,''))}</div>
      ${mode==='up'?'<p class="muted" style="margin:10px 0 0">A manager or the committee approves new players before you can see the club area.</p>':''}
    </form>
    <p class="muted" style="text-align:center"><a href="../">← Back to the club website</a></p></div>`;
  root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => authView(b.dataset.m));
  $('#af').onsubmit = async e => {
    e.preventDefault(); const m = $('#am'); m.className = 'msg'; m.textContent = 'Working…';
    const email = $('#ae').value.trim();
    try {
      if (mode === 'in') {
        const { error } = await sb.auth.signInWithPassword({ email, password: $('#aw').value });
        if (error) throw error; boot();
      } else if (mode === 'up') {
        const prof = { name: $('#an').value.trim(), nickname: $('#ak').value.trim(), phone: $('#ap').value.trim() };
        try { localStorage.setItem('wfc-pending-profile', JSON.stringify(prof)); } catch (_) {}
        const { data, error } = await sb.auth.signUp({ email, password: $('#aw').value, options: { emailRedirectTo: location.href.split('#')[0] } });
        if (error) throw error;
        if (data.session) boot(); else authView('in', 'Check your email and tap the link to confirm, then sign in here.');
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
        if (error) throw error; m.className = 'msg ok'; m.textContent = 'If that email has a login, a reset link is on its way.';
      }
    } catch (err) { m.className = 'msg bad'; m.textContent = err.message; }
  };
}
function pendingView(st) {
  root.innerHTML = `<div class="auth"><img class="crest" src="${CREST}" alt=""><h1>${st === 'left' ? 'Login switched off' : 'Nearly there'}</h1>
    <p class="sub">${st === 'left' ? 'Your club login has been switched off. Speak to the manager if that\'s wrong.' : 'Your login is waiting for a manager or the committee to approve it. You\'ll get in as soon as they do.'}</p>
    <div class="row" style="justify-content:center"><button onclick="boot()">Check again</button><button class="ghost" onclick="signOut()">Sign out</button></div></div>`;
}
async function signOut() { await sb.auth.signOut(); authView('in'); }

/* ---------- data ---------- */
async function loadCore() {
  const since = new Date(Date.now() - 120 * 864e5).toISOString();
  const [ev, rs, st, ro, se] = await Promise.all([
    sb.from('wfc_events').select('*').gte('starts_at', since).order('starts_at'),
    sb.from('wfc_rsvps').select('*'),
    sb.from('wfc_match_stats').select('*').order('minute', { nullsFirst: false }),
    sb.rpc('wfc_roster'),
    sb.from('wfc_settings').select('*')
  ]);
  for (const r of [ev, rs, st, ro, se]) if (r.error) throw r.error;
  S.events = ev.data; S.rsvps = rs.data; S.stats = st.data; S.roster = ro.data;
  S.settings = Object.fromEntries(se.data.map(x => [x.key, x.value]));
}
const nameOf = id => { const m = S.roster.find(x => x.id === id); return m ? (m.nickname || m.name) : 'Unknown'; };
const evTitle = e => e.kind === 'match' ? `v ${e.opponent || 'TBC'}` : (e.title || ({training:'Training',event:'Club event',meeting:'Meeting'})[e.kind]);
const myAnswer = e => (S.rsvps.find(r => r.event_id === e.id && r.member_id === S.me.id) || {}).answer;
const isPast = e => D(e.starts_at) < new Date(Date.now() - 2 * 3600e3);

/* ---------- shell ---------- */
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  events: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  money: '<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5v6M18 9.5v6"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/>',
  club: '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>',
  treasury: '<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>'
};
function tabs() {
  const t = S.me.id ? [['home','Home'],['events','Events'],['money','My money'],['me','Me']] : [['home','Home'],['events','Events']];
  if (can(STAFF)) t.push(['club','Manage']);
  if (can(['admin','committee','treasurer'])) t.push(['treasury','Treasury']);
  return t;
}
function shell() {
  const m = S.me;
  root.innerHTML = `<header class="top"><div class="wrap"><img src="${CREST}" alt=""><div><b>West Farnborough FC</b><small>Club hub</small></div>
    <div class="who">${esc(m.nickname || m.name)}<br><span>${esc(S.role)}</span></div></div></header>
    <main><div class="wrap" id="view"></div></main>
    <nav class="nav" aria-label="Club hub"><div>${tabs().map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[k]}</svg>${l}</button>`).join('')}</div></nav>`;
  root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => go(b.dataset.t));
  render();
}
function go(t) { S.tab = t; root.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t)); scrollTo(0, 0); render(); }
function render() { const v = $('#view'); ({ home: homeV, events: eventsV, money: moneyV, me: meV, club: clubV, treasury: treasuryV })[S.tab](v); }

/* ---------- event card ---------- */
function evCard(e, withRsvp = true) {
  const d = D(e.starts_at), a = myAnswer(e), rs = S.rsvps.filter(r => r.event_id === e.id);
  const cnt = k => rs.filter(r => r.answer === k).length;
  const played = e.status === 'played' && e.our_score != null;
  return `<article class="card"><div class="ev" data-open="${e.id}">
    <div class="d"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-GB', { month: 'short' })}</span></div>
    <div><div class="row"><span class="pill ${e.kind}">${e.kind}</span>${e.status !== 'scheduled' && e.status !== 'played' ? `<span class="pill" style="color:#ff8f8f">${e.status}</span>` : ''}${e.fee_pence ? `<span class="pill">${gbp(e.fee_pence)}</span>` : ''}</div>
      <h3>${esc(evTitle(e))}${played ? ` <span class="score">${e.our_score}–${e.their_score}</span>` : ''}</h3>
      <div class="muted">${fDay(e.starts_at)} · ${fTime(e.starts_at)}${e.meet_at ? ` (meet ${fTime(e.meet_at)})` : ''}${e.comp ? ' · ' + esc(e.comp) : ''}</div>
      ${e.venue ? `<div class="muted">📍 ${esc(e.venue)}</div>` : ''}</div></div>
    ${withRsvp && S.me.id && !isPast(e) && e.status === 'scheduled' ? `<div class="rsvp" data-ev="${e.id}">
      ${['yes','maybe','no'].map(k => `<button data-on="${k}" class="${a === k ? 'on' : ''}">${{yes:'✔ Yes',maybe:'? Maybe',no:'✕ No'}[k]}</button>`).join('')}</div>` : ''}
    <div class="counts"><span><i class="y">${cnt('yes')}</i> in</span><span><i class="m">${cnt('maybe')}</i> maybe</span><span><i class="n">${cnt('no')}</i> out</span></div></article>`;
}
function wireCards(v) {
  v.querySelectorAll('[data-open]').forEach(x => x.onclick = () => eventDetail(x.dataset.open));
  v.querySelectorAll('.rsvp').forEach(box => box.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const ev = box.dataset.ev, ans = b.dataset.on;
    await run(sb.from('wfc_rsvps').upsert({ event_id: ev, member_id: S.me.id, answer: ans, updated_at: new Date().toISOString() }));
    const ex = S.rsvps.find(r => r.event_id === ev && r.member_id === S.me.id);
    if (ex) ex.answer = ans; else S.rsvps.push({ event_id: ev, member_id: S.me.id, answer: ans });
    toast(ans === 'yes' ? "You're in 👊" : ans === 'no' ? 'Marked as not available' : 'Marked as maybe');
    render();
  }));
}

/* ---------- home ---------- */
async function homeV(v) {
  const up = S.events.filter(e => !isPast(e) && e.status !== 'cancelled').slice(0, 4);
  const unanswered = up.filter(e => !myAnswer(e)).length;
  const res = S.events.filter(e => e.kind === 'match' && e.status === 'played').slice(-3).reverse();
  v.innerHTML = `<div class="kicker">Alright ${esc(S.me.nickname || S.me.name.split(' ')[0])}</div>
    <div class="h"><h2>What's on</h2>${can(STAFF) ? '<button class="sm pri" id="newEv">+ New</button>' : ''}</div>
    <div id="owe"></div>
    ${unanswered ? `<div class="card" style="border-color:var(--gold)"><b>${unanswered} event${unanswered > 1 ? 's' : ''} need${unanswered > 1 ? '' : 's'} your answer.</b> <span class="muted">Tap yes, maybe or no so the manager can plan.</span></div>` : ''}
    ${up.map(e => evCard(e)).join('') || '<div class="card empty">Nothing in the diary yet.</div>'}
    ${res.length ? `<div class="h" style="margin-top:22px"><h2>Recent results</h2></div>${res.map(e => `<div class="card row" data-open="${e.id}" style="cursor:pointer"><div class="grow"><b>${esc(evTitle(e))}</b><div class="muted">${fDay(e.starts_at)} · ${esc(e.comp || '')}</div></div><span class="score">${e.our_score}–${e.their_score}</span></div>`).join('')}` : ''}`;
  wireCards(v);
  const nb = $('#newEv'); if (nb) nb.onclick = () => eventForm();
  const { data } = await sb.rpc('wfc_balances');
  const mine = (data || []).find(r => r.member_id === S.me.id);

function attendance(e) {

      await run(sb.from('wfc_payments').insert({ member_id: S.me.id, charge_id: b.dataset.claim, amount_pence: toPence($('#ca').value), method: $('#cm').value, note: $('#cn').value.trim() || null, status: 'claimed' }), 'Sent to the treasurer');

function parseTable(txt) {
  const rows = [];
  for (const raw of txt.split(/\n/)) {
    const line = raw.replace(/\t/g, ' ').replace(/\s+/g, ' ').trim(); if (!line) continue;
    const m = line.match(/^(?:\d+\.?\s+)?(.+?)\s+((?:[-+−]?\d+\s+){4,8}[-+−]?\d+)$/); if (!m) continue;
    const n = m[2].replace(/−/g, '-').split(' ').map(Number);
    let r;
    if (n.length >= 8) r = { p: n[0], w: n[1], d: n[2], l: n[3], f: n[4], a: n[5], gd: n[6], pts: n[n.length - 1] };
    else if (n.length === 7) r = { p: n[0], w: n[1], d: n[2], l: n[3], f: n[4], a: n[5], gd: n[4] - n[5], pts: n[6] };
    else if (n.length === 6) r = { p: n[0], w: n[1], d: n[2], l: n[3], gd: n[4], pts: n[5] };
    else r = { p: n[0], w: n[1], d: n[2], l: n[3], gd: 0, pts: n[4] };
    rows.push({ team: m[1].trim(), ...r });
  }
  return rows;
}
function parseFixtures(txt) {
  const out = [], US = /west\s*farnborough/i;
  const dateRe = /(\d{1,2})\/(\d{1,2})\/(\d{2,4})/g;
  const marks = [...txt.matchAll(dateRe)];
  marks.forEach((m, k) => {
    const chunk = txt.slice(m.index + m[0].length, k + 1 < marks.length ? marks[k + 1].index : txt.length);
    const yr = +m[3] < 100 ? 2000 + +m[3] : +m[3];
    const tm = chunk.match(/\b(\d{1,2}):(\d{2})\b/);
    const rest = tm ? chunk.slice(chunk.indexOf(tm[0]) + tm[0].length) : chunk;
    let cells = rest.split(/\t|\n|\s{2,}/).map(x => x.trim()).filter(Boolean);
    let i = cells.findIndex(c => /^(vs?|\d+\s*-\s*\d+)$/i.test(c));
    let home, away, tok, comp = '';
    if (i > 0 && i < cells.length - 1) { home = cells[i - 1]; away = cells[i + 1]; tok = cells[i];
      comp = cells.slice(0, i - 1).concat(cells.slice(i + 2)).find(c => /div|cup|league|trophy|shield|friendly/i.test(c)) || ''; }
    else { const r = rest.replace(/\s+/g, ' ').match(/(.+?)\s+(\d+\s*-\s*\d+|VS|v)\s+(.+)/i); if (!r) return; home = r[1].trim(); tok = r[2]; away = r[3].trim();
      const cm = home.match(/^(.*?(?:Division \d+|Cup|League))\s+(.+)$/i); if (cm) { comp = cm[1]; home = cm[2]; } }
    const homeUs = US.test(home), awayUs = US.test(away); if (!homeUs && !awayUs) return;
    const sc = tok.match(/(\d+)\s*-\s*(\d+)/);
    const hh = tm ? +tm[1] : 10, mm = tm ? +tm[2] : 30;
    const when = new Date(yr, +m[2] - 1, +m[1], hh, mm);
    out.push({ when, opponent: (homeUs ? away : home).replace(/\s+(?:Division|Cup|League)\b.*$/i, '').trim(), home_away: homeUs ? 'home' : 'away', comp,
      our: sc ? +(homeUs ? sc[1] : sc[2]) : null, their: sc ? +(homeUs ? sc[2] : sc[1]) : null });
  });
  return out;
}

    tv.innerHTML = `<div class="grid4" style="margin-bottom:14px"><div class="stat ${playerIn + otherIn - out >= 0 ? 'good' : 'bad'}"><b>${gbp(playerIn + otherIn - out)}</b><span>Club balance</span></div>
      <div class="stat"><b>${gbp(playerIn + otherIn)}</b><span>Money in</span></div><div class="stat"><b>${gbp(out)}</b><span>Money out</span></div><div class="stat bad"><b>${gbp(owed)}</b><span>Owed by players</span></div></div>
      ${claims.length ? `<div class="card" style="border-color:var(--gold);cursor:pointer" id="goClaims"><b>${claims.length} payment${claims.length > 1 ? 's' : ''} waiting for you to confirm</b> <span class="muted">→</span></div>` : ''}
      <div class="grid2"><div class="card"><div class="kicker">Money in</div><table><tbody><tr><td>Player fees &amp; subs</td><td class="r">${gbp(playerIn)}</td></tr>${Object.entries(byCat).filter(([k]) => k.startsWith('in:')).map(([k, a]) => `<tr><td style="text-transform:capitalize">${esc(k.slice(3))}</td><td class="r">${gbp(a)}</td></tr>`).join('')}</tbody></table></div>
        <div class="card"><div class="kicker">Money out</div><table><tbody>${Object.entries(byCat).filter(([k]) => k.startsWith('out:')).map(([k, a]) => `<tr><td style="text-transform:capitalize">${esc(k.slice(4))}</td><td class="r">${gbp(a)}</td></tr>`).join('') || '<tr><td class="muted">Nothing yet</td></tr>'}</tbody></table></div></div>
      <div class="row"><button id="csv">Download everything (CSV)</button>${w ? '<button id="bulk">Charge signing-on fees</button>' : ''}</div>`;
    if ($('#goClaims')) $('#goClaims').onclick = () => { trTab = 'claims'; render(); };
    $('#csv').onclick = () => {
      const rows = [['Date','Type','Category','Who / description','In','Out','Status']];
      conf.concat(claims).forEach(p => rows.push([p.paid_on, 'Player payment', p.method, nameOf(p.member_id) + (p.note ? ' – ' + p.note : ''), (p.amount_pence / 100).toFixed(2), '', p.status]));
      L.forEach(x => rows.push([x.txn_date, 'Ledger', x.category, x.description + (x.party ? ' – ' + x.party : ''), x.direction === 'in' ? (x.amount_pence / 100).toFixed(2) : '', x.direction === 'out' ? (x.amount_pence / 100).toFixed(2) : '', '']));
      const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `west-farnborough-fc-accounts-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    };
    if ($('#bulk')) $('#bulk').onclick = () => bulkCharge();
  } else if (trTab === 'players') {
    tv.innerHTML = `<div class="card scroll"><table><thead><tr><th>Player</th><th class="r">Charged</th><th class="r">Paid</th><th class="r">Owes</th><th></th></tr></thead><tbody>${B.map(b => `<tr><td><b>${esc(b.name)}</b>${b.claimed ? `<div class="muted">${gbp(b.claimed)} to confirm</div>` : ''}</td><td class="r">${gbp(b.charged)}</td><td class="r">${gbp(b.paid)}</td><td class="r" style="color:${b.owed > 0 ? '#ff8f8f' : '#7fd8a0'};font-weight:700">${gbp(b.owed)}</td><td class="r"><button class="sm" data-acc="${b.member_id}">Open</button></td></tr>`).join('')}</tbody></table></div>`;
    tv.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => account(b.dataset.acc, C, P));
  } else if (trTab === 'claims') {
    tv.innerHTML = claims.map(p => `<div class="card"><div class="row"><div class="grow"><b>${esc(nameOf(p.member_id))}</b> says they paid <b>${gbp(p.amount_pence)}</b> by ${p.method}<div class="muted">${fDate(p.paid_on)}${p.note ? ' · ' + esc(p.note) : ''}${p.charge_id ? ' · for ' + esc((C.find(c => c.id === p.charge_id) || {}).description || 'a charge') : ''}</div></div>
      ${w ? `<button class="sm pri" data-cf="${p.id}">Confirm</button><button class="sm" data-rj="${p.id}">Reject</button>` : ''}</div></div>`).join('') || '<div class="card empty">Nothing waiting. All square.</div>';
    tv.querySelectorAll('[data-cf]').forEach(b => b.onclick = async () => { await run(sb.from('wfc_payments').update({ status: 'confirmed' }).eq('id', b.dataset.cf), 'Confirmed'); render(); });
    tv.querySelectorAll('[data-rj]').forEach(b => b.onclick = async () => { await run(sb.from('wfc_payments').update({ status: 'rejected' }).eq('id', b.dataset.rj), 'Rejected'); render(); });
  } else {
    tv.innerHTML = `<div class="card scroll"><table><thead><tr><th>Date</th><th>What</th><th class="r">In</th><th class="r">Out</th></tr></thead><tbody>${L.map(x => `<tr ${w ? `data-led="${x.id}" style="cursor:pointer"` : ''}><td class="muted">${fDate(x.txn_date)}</td><td><b>${esc(x.description)}</b><div class="muted" style="text-transform:capitalize">${esc(x.category)}${x.party ? ' · ' + esc(x.party) : ''}</div></td><td class="r" style="color:#7fd8a0">${x.direction === 'in' ? gbp(x.amount_pence) : ''}</td><td class="r" style="color:#ff8f8f">${x.direction === 'out' ? gbp(x.amount_pence) : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No entries yet. Add pitch hire, ref fees, sponsorship and so on.</td></tr>'}</tbody></table></div>
      <p class="muted">Player fees are counted automatically from confirmed payments, so don't add them here too.</p>`;
    tv.querySelectorAll('[data-led]').forEach(r => r.onclick = () => ledgerForm(L.find(x => x.id === r.dataset.led)));
  }
}
function ledgerForm(x = null) {
  const e = x || { direction: 'out', category: 'pitch hire', txn_date: new Date().toISOString().slice(0, 10) };
  const cats = d => (d === 'in' ? CATS_IN : CATS_OUT).map(c => `<option ${e.category === c ? 'selected' : ''}>${c}</option>`).join('');
  openDlg(x ? 'Edit entry' : 'Money in / out', `<form id="lf"><div class="seg"><button type="button" data-d="in" class="${e.direction === 'in' ? 'on' : ''}">Money in</button><button type="button" data-d="out" class="${e.direction === 'out' ? 'on' : ''}">Money out</button></div>
    <label>Category</label><select id="lc">${cats(e.direction)}</select>
    <label>Description</label><input id="ld" required value="${esc(e.description)}" placeholder="Pitch hire Nov / Ref v Townhill / Higgys sponsorship">
    <div class="grid2"><div><label>Amount (£)</label><input id="la" required inputmode="decimal" value="${e.amount_pence ? (e.amount_pence / 100).toFixed(2) : ''}"></div><div><label>Date</label><input id="lt" type="date" value="${e.txn_date}"></div></div>
    <label>Paid to / received from</label><input id="lp" value="${esc(e.party)}">
    <label>Receipt link</label><input id="lr" type="url" value="${esc(e.receipt_url)}" placeholder="Optional">
    <div class="row" style="margin-top:14px"><button class="pri grow">Save</button>${x ? '<button type="button" id="ldel" class="ghost" style="color:#ff8f8f">Delete</button>' : ''}</div></form>`);
  let dir = e.direction;
  document.querySelectorAll('#lf [data-d]').forEach(b => b.onclick = () => { dir = b.dataset.d; document.querySelectorAll('#lf [data-d]').forEach(y => y.classList.toggle('on', y === b)); e.category = ''; $('#lc').innerHTML = cats(dir); });
  $('#lf').onsubmit = async ev => { ev.preventDefault();
    const row = { direction: dir, category: $('#lc').value, description: $('#ld').value.trim(), amount_pence: toPence($('#la').value), txn_date: $('#lt').value, party: $('#lp').value.trim() || null, receipt_url: $('#lr').value.trim() || null };
    if (row.amount_pence <= 0) return toast('Enter an amount');
    if (x) await run(sb.from('wfc_ledger').update(row).eq('id', x.id), 'Saved'); else await run(sb.from('wfc_ledger').insert(row), 'Added to the ledger');
    dlg.close(); trTab = 'ledger'; render(); };
  if (x) $('#ldel').onclick = async () => { if (confirm('Delete this entry?')) { await run(sb.from('wfc_ledger').delete().eq('id', x.id), 'Deleted'); dlg.close(); render(); } };
}
function account(mid, C, P) {
  const w = can(MONEY_WRITE), cs = C.filter(c => c.member_id === mid), ps = P.filter(p => p.member_id === mid);
  openDlg(nameOf(mid), `${w ? '<div class="row" style="margin:10px 0"><button class="pri grow" id="aC">+ Add charge</button><button class="grow" id="aP">+ Record payment</button></div>' : ''}
    <label>Charges</label><table><tbody>${cs.map(c => `<tr><td>${esc(c.description)}<div class="muted">${fDate(c.created_at)}</div></td><td class="r">${gbp(c.amount_pence)}</td>${w ? `<td class="r"><button class="sm ghost" data-void="${c.id}">Void</button></td>` : ''}</tr>`).join('') || '<tr><td class="muted">None</td></tr>'}</tbody></table>
    <label>Payments</label><table><tbody>${ps.map(p => `<tr><td>${fDate(p.paid_on)} · ${p.method}<div class="muted">${p.status}${p.note ? ' · ' + esc(p.note) : ''}</div></td><td class="r">${gbp(p.amount_pence)}</td></tr>`).join('') || '<tr><td class="muted">None</td></tr>'}</tbody></table>`);
  if (!w) return;
  $('#aC').onclick = () => { openDlg('Add charge · ' + nameOf(mid), `<form id="cf"><label>Type</label><select id="ck">${Object.entries(CHARGE_KINDS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
      <label>Description</label><input id="cd" required placeholder="Signing-on fee 2026/27"><div class="grid2"><div><label>Amount (£)</label><input id="ca" required inputmode="decimal"></div><div><label>Due</label><input id="cdu" type="date"></div></div>
      <button class="pri" style="width:100%;margin-top:14px">Add charge</button></form>`);
    $('#cf').onsubmit = async e => { e.preventDefault(); await run(sb.from('wfc_charges').insert({ member_id: mid, kind: $('#ck').value, description: $('#cd').value.trim(), amount_pence: toPence($('#ca').value), due_on: $('#cdu').value || null, pay_link: (S.settings.pay_link || '') || null }), 'Charge added'); dlg.close(); render(); }; };
  $('#aP').onclick = () => { openDlg('Record payment · ' + nameOf(mid), `<form id="pf2"><div class="grid2"><div><label>Amount (£)</label><input id="pa" required inputmode="decimal"></div><div><label>Date</label><input id="pd" type="date" value="${new Date().toISOString().slice(0, 10)}"></div></div>
      <label>How</label><select id="pm"><option value="cash">Cash</option><option value="bank">Bank transfer</option><option value="card">Card</option><option value="other">Other</option></select><label>Note</label><input id="pn2">
      <button class="pri" style="width:100%;margin-top:14px">Record payment</button></form>`);
    $('#pf2').onsubmit = async e => { e.preventDefault(); await run(sb.from('wfc_payments').insert({ member_id: mid, amount_pence: toPence($('#pa').value), paid_on: $('#pd').value, method: $('#pm').value, note: $('#pn2').value.trim() || null, status: 'confirmed' }), 'Payment recorded'); dlg.close(); render(); }; };
  document.querySelectorAll('[data-void]').forEach(b => b.onclick = async () => { if (confirm('Void this charge?')) { await run(sb.from('wfc_charges').update({ void: true }).eq('id', b.dataset.void), 'Voided'); dlg.close(); render(); } });
}
function bulkCharge() {
  const sq = S.roster.filter(m => m.in_squad && m.role !== 'admin'), def = (S.settings.fees || {}).signing_on || 0;
  openDlg('Charge signing-on fees', `<form id="bf"><div class="grid2"><div><label>Amount each (£)</label><input id="ba" required inputmode="decimal" value="${(def / 100).toFixed(2)}"></div><div><label>Due</label><input id="bd" type="date"></div></div>
    <label>Description</label><input id="bt" value="Signing-on fee 2026/27">
    <label>Who</label>${sq.map(m => `<label class="check"><input type="checkbox" data-b="${m.id}" checked> ${esc(m.nickname || m.name)}</label>`).join('')}
    <button class="pri" style="width:100%;margin-top:14px">Add charges</button></form>`);
  $('#bf').onsubmit = async e => { e.preventDefault(); const amt = toPence($('#ba').value); if (amt <= 0) return toast('Enter an amount');
    const rows = [...document.querySelectorAll('#bf [data-b]:checked')].map(c => ({ member_id: c.dataset.b, kind: 'signing_on', description: $('#bt').value.trim(), amount_pence: amt, due_on: $('#bd').value || null, pay_link: (S.settings.pay_link || '') || null }));
    await run(sb.from('wfc_charges').insert(rows), `${rows.length} charges added`); dlg.close(); render(); };
}

/* ---------- boot ---------- */
async function refresh() { await loadCore(); render(); }
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView('in');
  let { data: who, error } = await sb.rpc('wfc_whoami');
  if (error) return authView('in', '!' + error.message);
  if (!who.member && !who.owner) {
    let prof = null; try { prof = JSON.parse(localStorage.getItem('wfc-pending-profile') || 'null'); } catch (_) {}
    const nm = (prof && prof.name) || session.user.email.split('@')[0];
    await sb.rpc('wfc_register', { p_name: nm, p_nickname: prof && prof.nickname, p_phone: prof && prof.phone });
    try { localStorage.removeItem('wfc-pending-profile'); } catch (_) {}
    ({ data: who } = await sb.rpc('wfc_whoami'));
  }
  if (!who.role) return pendingView(who.member && who.member.status);
  if (!who.member) S.tab = 'home';
  S.role = who.role;
  S.me = who.member || { id: null, name: 'Dunnworks', nickname: 'Dunnworks' };
  root.innerHTML = '<div class="auth"><img class="crest" src="' + CREST + '" alt=""><p class="sub">Loading the club…</p></div>';
  await loadCore(); shell();
}
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') {
  openDlg('Set a new password', '<form id="rp"><label>New password</label><input id="rpw" type="password" minlength="8" required><button class="pri" style="width:100%;margin-top:14px">Save</button></form>');
  $('#rp').onsubmit = async e => { e.preventDefault(); await run(sb.auth.updateUser({ password: $('#rpw').value }), 'Password changed'); dlg.close(); boot(); };
} });
boot();
</script>
