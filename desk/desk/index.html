<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0a0a">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("dw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  body { padding-block: 28px 80px; }
  .desk-head { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between; margin-bottom:26px; }
  .desk-head h1 { font-size: clamp(26px,3.4vw,36px); }
  .desk-sub { color:var(--muted); font-size:15px; margin-top:8px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:22px; }
  .chip { font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
          padding:9px 14px; border:1px solid var(--line-2); border-radius:var(--radius);
          background:transparent; color:var(--muted); cursor:pointer; }
  .chip.is-on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .bar input[type=search] { flex:1 1 220px; min-width:180px; padding:10px 14px; border:1px solid var(--line-2);
          border-radius:var(--radius); background:var(--ink-2); color:var(--paper); font:inherit; font-size:15px; }
  .bar label { font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2); }
  .jobs { display:grid; gap:14px; }
  .job { display:grid; grid-template-columns:64px minmax(0,1fr); gap:18px; padding:20px 22px;
         border:1px solid var(--line); border-radius:var(--radius); background:var(--ink-2); }
  .job.is-done { opacity:.5; }
  .score { font-family:var(--font-display); font-size:26px; font-weight:700; line-height:1; text-align:center; }
  .score small { display:block; font-family:var(--font-mono); font-size:10px; font-weight:400;
                 letter-spacing:.1em; color:var(--muted-2); margin-top:6px; }
  .s-hot { color:#4fd08a; } .s-warm { color:var(--accent-2); } .s-cool { color:var(--muted); }
  .job h3 { font-size:19px; margin-bottom:6px; }
  .job h3 a:hover { color:var(--accent-2); }
  .meta { color:var(--muted); font-size:14.5px; margin-bottom:10px; }
  .why { color:var(--muted); font-size:14px; margin:0 0 12px; }
  .why b { color:var(--paper); font-weight:500; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .mini { font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
          padding:6px 10px; border:1px solid var(--line-2); border-radius:var(--radius);
          background:transparent; color:var(--muted); cursor:pointer; }
  .mini:hover { border-color:var(--accent-2); color:var(--accent-2); }
  .mini.is-on { border-color:var(--accent); color:var(--accent-2); background:var(--accent-dim); }
  .stat { font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; color:var(--muted-2); }
  .gate { max-width:420px; margin:10vh auto 0; }
  .gate .field { margin-bottom:16px; }
  .gate label { display:block; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em;
                text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .gate input { width:100%; padding:12px 14px; border:1px solid var(--line-2); border-radius:var(--radius);
                background:var(--ink-2); color:var(--paper); font:inherit; }
  .msg { font-size:14.5px; margin-top:14px; min-height:20px; }
  .msg.bad { color:var(--bad); } .msg.ok { color:#4fd08a; }
  .elsewhere { margin-top:34px; padding-top:22px; border-top:1px solid var(--line); }
  @media (max-width:620px){ .job { grid-template-columns:48px minmax(0,1fr); gap:12px; padding:16px; } }
</style>
</head>
<body>

<main class="wrap" id="main">

  <!-- ------------------------------------------------------------- sign in -->
  <section class="gate" id="gate" hidden>
    <h1 class="h3" style="margin-bottom:8px">Desk</h1>
    <p style="color:var(--muted); font-size:15px; margin-bottom:26px">Sign in to continue.</p>
    <form id="signin" class="card" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="info@dunnworks.io">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn--wide" type="submit">Sign in</button>
      <p class="msg" id="gate-msg" role="status" aria-live="polite"></p>
      <p style="color:var(--muted-2); font-size:13.5px; margin-top:4px">
        No password to hand? <button type="button" class="mini" id="magic">Email me a link</button>
      </p>
    </form>
  </section>

  <!-- ---------------------------------------------------------------- app -->
  <section id="app" hidden>
    <div class="desk-head">
      <div>
        <h1>Job radar</h1>
        <p class="desk-sub" id="sub">Live UK roles, scored against your CV.</p>
      </div>
      <div class="row">
        <button class="btn btn--ghost" id="refresh" type="button">Refresh now</button>
        <button class="mini" id="signout" type="button">Sign out</button>
      </div>
    </div>

    <div class="bar">
      <button class="chip is-on" data-cat="all">All</button>
      <button class="chip" data-cat="cs">Customer success</button>
      <button class="chip" data-cat="am">Account management</button>
      <button class="chip" data-cat="field-sales">Field sales</button>
      <button class="chip" data-cat="shipping">Shipping</button>
      <span style="flex:1 1 12px"></span>
      <label for="minscore">Min score</label>
      <input id="minscore" type="range" min="0" max="90" step="5" value="45" style="width:120px">
      <span class="stat" id="minscore-val">45</span>
    </div>

    <div class="bar">
      <input type="search" id="q" placeholder="Search title, company, description">
      <button class="chip is-on" data-status="open">Open</button>
      <button class="chip" data-status="shortlist">Shortlist</button>
      <button class="chip" data-status="applied">Applied</button>
      <button class="chip" data-status="hidden">Hidden</button>
    </div>

    <p class="stat" id="count" style="margin-bottom:14px"></p>
    <div class="jobs" id="jobs"></div>
    <p class="msg" id="app-msg" role="status" aria-live="polite"></p>

    <div class="elsewhere">
      <p class="stat" style="margin-bottom:12px">Not covered by the APIs &mdash; these open a pre-filtered search</p>
      <div class="row" id="links"></div>
    </div>
  </section>

</main>

<script src="../assets/js/dw-config.js"></script>
<script src="../assets/js/dw-data.js"></script>
<script>
(function () {
  'use strict';
  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var gateMsg = document.getElementById('gate-msg');
  var appMsg = document.getElementById('app-msg');
  var jobsEl = document.getElementById('jobs');
  var state = { cat: 'all', status: 'open', min: 45, q: '', rows: [] };

  function say(el, text, cls) { el.className = 'msg' + (cls ? ' ' + cls : ''); el.textContent = text || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function when(iso) {
    if (!iso) return '';
    var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d < 28) return d + ' days ago';
    return Math.round(d / 7) + ' weeks ago';
  }

  document.getElementById('signin').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('password').value;
    if (!pw) { say(gateMsg, 'Enter your password, or use the email link.', 'bad'); return; }
    say(gateMsg, 'Signing in...');
    DWData.signInWithPassword(email, pw)
      .then(start)
      .catch(function (err) { say(gateMsg, err.message || 'That did not work.', 'bad'); });
  });

  document.getElementById('magic').addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!email) { say(gateMsg, 'Put your email address in first.', 'bad'); return; }
    say(gateMsg, 'Sending...');
    DWData.sendMagicLink(email, location.href)
      .then(function () { say(gateMsg, 'Link sent. Open it on this device.', 'ok'); })
      .catch(function (err) { say(gateMsg, err.message || 'Could not send it.', 'bad'); });
  });

  document.getElementById('signout').addEventListener('click', function () {
    DWData.signOut().then(function () { location.reload(); });
  });

  function load() {
    say(appMsg, 'Loading...');
    return DWData.rest('dw_jobs?select=*&order=score.desc,posted_at.desc')
      .then(function (rows) {
        state.rows = rows || [];
        say(appMsg, '');
        render();
        return DWData.rest('dw_job_runs?select=*&order=started_at.desc&limit=1');
      })
      .then(function (runs) {
        var r = runs && runs[0];
        if (!r) return;
        document.getElementById('sub').textContent =
          'Live UK roles, scored against your CV. Last checked ' + when(r.started_at) +
          (r.ok === false ? ' - last run reported a problem' : '') + '.';
      })
      .catch(function (err) { say(appMsg, err.message, 'bad'); });
  }

  function setStatus(id, status) {
    return DWData.rest('dw_jobs?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH', body: { status: status }, headers: { Prefer: 'return=minimal' }
    }).then(function () {
      state.rows.forEach(function (r) { if (r.id === id) r.status = status; });
      render();
    }).catch(function (err) { say(appMsg, err.message, 'bad'); });
  }

  document.getElementById('refresh').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true; btn.textContent = 'Checking...';
    say(appMsg, 'Asking Adzuna and Reed for anything new. Give it a minute.');
    fetch(window.DW.url + '/functions/v1/fetch-jobs', {
      method: 'POST',
      headers: {
        apikey: window.DW.anonKey,
        Authorization: 'Bearer ' + (JSON.parse(localStorage.getItem('dw-auth') || '{}').access_token || ''),
        'Content-Type': 'application/json'
      }
    }).then(function (r) { return r.json(); })
      .then(function (out) {
        if (!out.ok) throw new Error(out.error || 'the fetch failed');
        say(appMsg, 'Found ' + out.fetched + ' ads, kept ' + out.kept + '.' +
          (out.problems && out.problems.length ? ' Problems: ' + out.problems.join(' | ') : ''), 'ok');
        return load();
      })
      .catch(function (err) { say(appMsg, err.message, 'bad'); })
      .finally(function () { btn.disabled = false; btn.textContent = 'Refresh now'; });
  });

  function visible() {
    return state.rows.filter(function (r) {
      if (state.cat !== 'all' && r.category !== state.cat) return false;
      if (state.status === 'open' && (r.status === 'hidden' || r.status === 'rejected')) return false;
      if (state.status !== 'open' && r.status !== state.status) return false;
      if ((r.score || 0) < state.min) return false;
      if (state.q) {
        var hay = (r.title + ' ' + (r.company || '') + ' ' + (r.location || '') + ' ' + (r.description || '')).toLowerCase();
        if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  function render() {
    var rows = visible();
    document.getElementById('count').textContent =
      rows.length + ' of ' + state.rows.length + ' roles' +
      (state.min ? ' scoring ' + state.min + '+' : '');

    jobsEl.innerHTML = rows.map(function (r) {
      var cls = r.score >= 70 ? 's-hot' : r.score >= 50 ? 's-warm' : 's-cool';
      var reasons = (r.score_reasons || []).map(esc).join(' &middot; ');
      return '<article class="job' + (r.status === 'applied' || r.status === 'hidden' ? ' is-done' : '') + '">' +
        '<div class="score ' + cls + '">' + (r.score || 0) + '<small>match</small></div>' +
        '<div>' +
          '<h3><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) + '</a></h3>' +
          '<p class="meta">' + esc(r.company || 'Company not named') +
            ' &middot; ' + esc(r.location || 'UK') +
            (r.salary_text ? ' &middot; ' + esc(r.salary_text) : '') +
            (r.posted_at ? ' &middot; ' + when(r.posted_at) : '') +
            ' &middot; ' + esc(r.source) + '</p>' +
          (reasons ? '<p class="why"><b>Why:</b> ' + reasons + '</p>' : '') +
          '<div class="row">' +
            '<button class="mini' + (r.status === 'shortlist' ? ' is-on' : '') + '" data-set="shortlist" data-id="' + r.id + '">Shortlist</button>' +
            '<button class="mini' + (r.status === 'applied' ? ' is-on' : '') + '" data-set="applied" data-id="' + r.id + '">Applied</button>' +
            '<button class="mini" data-set="hidden" data-id="' + r.id + '">Hide</button>' +
            '<a class="mini" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">Open ad</a>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('') || '<p style="color:var(--muted)">Nothing matches those filters. Drop the minimum score or hit Refresh now.</p>';
  }

  jobsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-set]');
    if (!b) return;
    var next = b.classList.contains('is-on') ? 'new' : b.getAttribute('data-set');
    setStatus(b.getAttribute('data-id'), next);
  });

  document.querySelectorAll('[data-cat]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-cat]').forEach(function (x) { x.classList.remove('is-on'); });
      b.classList.add('is-on'); state.cat = b.getAttribute('data-cat'); render();
    });
  });
  document.querySelectorAll('[data-status]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-status]').forEach(function (x) { x.classList.remove('is-on'); });
      b.classList.add('is-on'); state.status = b.getAttribute('data-status'); render();
    });
  });
  document.getElementById('minscore').addEventListener('input', function () {
    state.min = Number(this.value);
    document.getElementById('minscore-val').textContent = this.value;
    render();
  });
  document.getElementById('q').addEventListener('input', function () { state.q = this.value.trim(); render(); });

  var elsewhere = [
    ['LinkedIn - customer success', 'https://www.linkedin.com/jobs/search/?keywords=customer%20success%20manager&location=United%20Kingdom&f_TPR=r604800&sortBy=DD'],
    ['LinkedIn - account director', 'https://www.linkedin.com/jobs/search/?keywords=account%20director&location=United%20Kingdom&f_TPR=r604800&sortBy=DD'],
    ['LinkedIn - shipping / freight', 'https://www.linkedin.com/jobs/search/?keywords=shipping%20account%20manager&location=United%20Kingdom&f_TPR=r604800&sortBy=DD'],
    ['CV-Library - customer success', 'https://www.cv-library.co.uk/customer-success-manager-jobs?perpage=50&posted=7'],
    ['CV-Library - field sales, Hampshire', 'https://www.cv-library.co.uk/field-sales-jobs-in-hampshire?perpage=50&posted=7'],
    ['Indeed - customer success', 'https://uk.indeed.com/jobs?q=customer+success+manager&l=United+Kingdom&fromage=7']
  ];
  document.getElementById('links').innerHTML = elsewhere.map(function (l) {
    return '<a class="mini" href="' + l[1] + '" target="_blank" rel="noopener noreferrer">' + l[0] + '</a>';
  }).join('');

  function start() {
    gate.hidden = true; app.hidden = false;
    load();
  }

  DWData.captureFromHash();
  DWData.whoami().then(function (user) {
    if (user && user.email) start();
    else { gate.hidden = false; }
  }).catch(function () { gate.hidden = false; });
})();
</script>
</body>
</html>
