<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem("dw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dunnworks</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dunnworks">
<link rel="manifest" href="/hq/manifest.webmanifest">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/hq/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root { --tabh: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
  html, body { overscroll-behavior-y: none; }
  body.hq-app { padding: 0; -webkit-tap-highlight-color: transparent; }
  body.hq-app #main { max-width: none; padding: 0; }
  .gate { padding: calc(40px + var(--safe-t)) 20px 40px; max-width: 440px; margin: 0 auto; }

  /* top bar */
  .ap-top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px;
            padding: calc(10px + var(--safe-t)) 16px 10px; background: color-mix(in srgb, var(--ink) 92%, transparent);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .ap-top img { width: 26px; height: 26px; border-radius: 6px; }
  .ap-top h1 { font-family: var(--font-display); font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap-ic { all: unset; cursor: pointer; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
  .ap-ic:active { background: var(--ink-2); }
  .ap-ic svg { width: 21px; height: 21px; }
  .ap-theme .sw { position: relative; width: 30px; height: 16px; border: 1px solid var(--line-2); border-radius: var(--radius); }
  .ap-theme .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; background: var(--accent); transition: transform .25s var(--ease); }
  :root[data-theme="light"] .ap-theme .sw::after { transform: translateX(14px); }
  :root[data-theme="light"] .ap-sheet-bg { background: rgba(16,16,26,.35); }
  :root[data-theme="light"] .ap-toast, :root[data-theme="light"] .ap-fab { box-shadow: 0 10px 30px rgba(16,16,26,.18); }
  .ap-ic.spin svg { animation: apspin .8s linear infinite; }
  @keyframes apspin { to { transform: rotate(360deg); } }

  #view { padding: 16px 14px calc(var(--tabh) + var(--safe-b) + 90px); }

  /* bottom tabs */
  .ap-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: grid; grid-template-columns: repeat(5, 1fr);
             height: calc(var(--tabh) + var(--safe-b)); padding-bottom: var(--safe-b);
             background: color-mix(in srgb, var(--ink) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
             border-top: 1px solid var(--line); }
  .ap-tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none;
               color: var(--muted-2); font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; position: relative; }
  .ap-tabs a svg { width: 23px; height: 23px; }
  .ap-tabs a.is-on { color: var(--accent-2); }
  .ap-tabs a b { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
                 background: var(--accent); color: var(--on-accent); font: 600 10px/17px var(--font-body, sans-serif); text-align: center; letter-spacing: 0; }

  /* quick add */
  .ap-fab { position: fixed; right: 16px; bottom: calc(var(--tabh) + var(--safe-b) + 16px); z-index: 61; width: 56px; height: 56px; border-radius: 18px;
            border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer;
            box-shadow: 0 10px 30px rgba(112,0,255,.35); }
  .ap-fab svg { width: 26px; height: 26px; }
  .ap-sheet-bg { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.5); }
  .ap-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; background: var(--ink); border-top: 1px solid var(--line-2);
              border-radius: 18px 18px 0 0; padding: 10px 18px calc(22px + var(--safe-b)); max-height: 88vh; overflow-y: auto; }
  .ap-sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 14px; }
  .ap-sheet h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 12px; }
  .ap-sheet label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted-2); margin: 12px 0 5px; }
  .ap-sheet input, .ap-sheet select, .ap-sheet textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--radius);
              background: var(--ink-2); color: var(--paper); font: inherit; font-size: 16px; }
  .ap-sheet .ap-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ap-sheet .btn { margin-top: 16px; width: 100%; }

  /* More and Alerts */
  .ap-list { display: grid; gap: 8px; }
  .ap-list a, .ap-list button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 15px 16px;
               border: 1px solid var(--line); border-radius: var(--radius); background: var(--ink-2); color: var(--paper); font-size: 16px; }
  .ap-list a span, .ap-list button span { flex: 1; }
  .ap-list small { color: var(--muted-2); font-size: 13px; }
  .ap-list svg { width: 20px; height: 20px; color: var(--accent-2); flex: none; }
  .ap-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); margin: 22px 0 10px; }
  .ap-h:first-child { margin-top: 0; }
  .ap-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--ink-2); padding: 16px; }
  .ap-card p { color: var(--muted); font-size: 14.5px; margin: 0 0 12px; }
  .ap-tog { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  .ap-tog:first-of-type { border-top: 0; }
  .ap-tog span { flex: 1; } .ap-tog small { display: block; color: var(--muted-2); font-size: 13px; margin-top: 2px; }
  .ap-tog input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line-2); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .ap-tog input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .ap-tog input:checked { background: var(--accent); } .ap-tog input:checked::after { transform: translateX(18px); }
  .ap-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .ap-install { margin-bottom: 14px; border: 1px solid var(--accent); border-radius: var(--radius); padding: 13px 14px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .ap-install span { flex: 1; } .ap-install b { color: var(--paper); }

  .ap-toast { position: fixed; left: 14px; right: 14px; bottom: calc(var(--tabh) + var(--safe-b) + 84px); z-index: 95; padding: 12px 14px; border-radius: var(--radius);
              background: var(--ink-2); border: 1px solid var(--line-2); font-size: 14px; color: var(--paper); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .ap-toast.bad { border-color: #e5484d; } .ap-toast.ok { border-color: var(--accent); }
  .ap-toast[hidden] { display: none; }

  /* the Workspace, reshaped for a phone */
  body.hq-app .hq { display: block; }
  body.hq-app .hq-nav { display: none !important; }
  body.hq-app .hq-h { font-size: 21px; }
  body.hq-app .hq-s { font-size: 13.5px; margin-bottom: 14px; }
  body.hq-app .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  body.hq-app .stat { padding: 11px 12px; } body.hq-app .stat b { font-size: 21px; } body.hq-app .stat span { font-size: 9px; }
  body.hq-app .bar { gap: 6px; } body.hq-app .bar select, body.hq-app .bar input { font-size: 16px; flex: 1 1 45%; min-width: 0; }
  body.hq-app input, body.hq-app select, body.hq-app textarea { font-size: 16px !important; }
  body.hq-app .hq-board { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 86%; gap: 10px;
         overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; margin: 0 -14px; padding: 0 14px 8px; scrollbar-width: none; }
  body.hq-app .hq-board::-webkit-scrollbar { display: none; }
  body.hq-app .hq-board > .hq-col { scroll-snap-align: center; max-height: calc(100vh - 330px); min-height: 200px; }
  body.hq-app .hq-pipe { grid-template-columns: minmax(0, 1fr); }
  body.hq-app .hq-pipe .hq-col { max-height: none; min-height: 0; }
  body.hq-app .hq-card { cursor: pointer; }
  body.hq-app .hq-drawer { width: 100vw; padding: calc(16px + var(--safe-t)) 18px calc(40px + var(--safe-b)); }
  body.hq-app .hq-grid2, body.hq-app .hq-docs { grid-template-columns: minmax(0, 1fr) !important; }
  body.hq-app .hq-add { flex-wrap: wrap; } body.hq-app .hq-add > * { flex: 1 1 100%; }
  body.hq-app .hq-add button { flex: 1 1 100%; padding: 11px; }
  body.hq-app table { display: block; overflow-x: auto; }
  body.hq-app .hq-list li { flex-wrap: wrap; row-gap: 6px; padding: 11px 0; font-size: 15px; }
  body.hq-app .hq-list .hq-t { flex: 1 1 calc(100% - 40px); }
  body.hq-app .hq-list li > input[type=checkbox] { width: 20px; height: 20px; flex: none; }
  body.hq-app .hq-list li > input[type=checkbox] ~ .hq-pill:first-of-type { margin-left: 30px; }
  body.hq-app .hq-main > form.hq-add[data-hq=addtask] { display: none; }
  body.ap-noFab .ap-fab { display: none; }
  .ap-dots { display: flex; justify-content: center; gap: 6px; margin: 8px 0 0; }
  .ap-dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line-2); transition: width .2s, background .2s; }
  .ap-dots i.on { width: 18px; background: var(--accent-2); }
</style>
</head>
<body class="hq-app hq-on">

<main id="main">

  <section class="gate" id="gate-auth" hidden>
    <img src="/hq/icon-192.png" alt="" width="56" height="56" style="border-radius:14px;margin-bottom:18px">
    <h1 class="h3" style="margin-bottom:8px">Dunnworks</h1>
    <p style="color:var(--muted); font-size:15px; margin-bottom:24px">Sign in to your workspace.</p>
    <form id="signin" class="card" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required value="info@dunnworks.io">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn--wide" type="submit">Sign in</button>
      <p class="msg" id="auth-msg" role="status" aria-live="polite"></p>
      <p style="color:var(--muted-2); font-size:13.5px; margin-top:4px">
        Forgotten it? <button type="button" class="mini" id="magic">Email me a link</button>
      </p>
    </form>
  </section>

  <section id="app" hidden>
    <header class="ap-top">
      <img src="/hq/icon-192.png" alt="">
      <h1 id="title">Today</h1>
      <button class="ap-ic ap-theme" id="theme" type="button" aria-label="Switch to the light theme" title="Switch to the light theme"><span class="sw" aria-hidden="true"></span></button>
      <button class="ap-ic" id="search" type="button" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ap-ic" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    </header>
    <div id="view"></div>
    <nav class="ap-tabs" id="tabs" aria-label="App">
      <a href="#/hq" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</a>
      <a href="#/hq/board" data-t="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="16.5" y="4" width="4" height="7" rx="1.5"/></svg>Jobs</a>
      <a href="#/hq/projects" data-t="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>Projects</a>
      <a href="#/hq/dashboards" data-t="dashboards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Sites</a>
      <a href="#/app/more" data-t="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More<b id="morebadge" hidden></b></a>
    </nav>
    <button class="ap-fab" id="fab" type="button" aria-label="Add a job"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <div class="ap-toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>

<script src="/assets/js/dw-config.js"></script>
<script src="/assets/js/dw-data.js"></script>
<script src="/assets/js/dw-woolmer.js?v=20261115b"></script>
<script src="/assets/js/dw-sitedash.js?v=20261115d"></script>
<script src="/assets/js/dw-hq.js?v=20261115e"></script>
<script>
(function () {
  'use strict';
  DWData.captureFromHash();

  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate-auth'), app = $('app'), view = $('view'), titleEl = $('title');
  var ME = { owner: true, email: '', member: null }, PROJECTS = [], INSTALL = null, lastSync = 0, toastT = 0;
  var TITLES = { '': 'Today', board: 'Jobs', projects: 'Projects', dashboards: 'Sites', pipeline: 'Pipeline', docs: 'Docs',
                 calendar: 'Calendar', inbox: 'Inbox', repos: 'Repos', assistant: 'Assistant', people: 'People' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function say(text, cls) {
    var t = $('toast'); if (!text) { t.hidden = true; return; }
    t.className = 'ap-toast' + (cls ? ' ' + cls : ''); t.textContent = text; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, cls === 'bad' ? 6000 : 3200);
  }
  function fn(b) { return DWData.fn('dw-hq', b); }
  var standalone = function () { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; };
  var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  /* light and dark, shared with dunnworks.io (same "dw-theme" key) */
  function theme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function applyTheme(t, save) {
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#ffffff' : '#101012');
    var b = $('theme'), next = t === 'light' ? 'dark' : 'light';
    b.setAttribute('aria-label', 'Switch to the ' + next + ' theme'); b.title = 'Switch to the ' + next + ' theme';
    if (save) try { localStorage.setItem('dw-theme', t); } catch (e) {}
    var lbl = $('themelbl'); if (lbl) lbl.textContent = t === 'light' ? 'Light' : 'Dark';
  }
  applyTheme(theme());
  $('theme').addEventListener('click', function () { applyTheme(theme() === 'light' ? 'dark' : 'light', true); });
  window.addEventListener('storage', function (e) { if (e.key === 'dw-theme') applyTheme(e.newValue === 'light' ? 'light' : 'dark'); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/hq/sw.js', { scope: '/hq/' }).catch(function () {});
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); INSTALL = e; if (/^#\/app/.test(location.hash) || !location.hash || location.hash === '#/hq') route(); });

  /* ---- sign in ---- */
  $('signin').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('email').value.trim(), pw = $('password').value, m = $('auth-msg');
    if (!pw) { m.className = 'msg bad'; m.textContent = 'Put your password in.'; return; }
    m.className = 'msg'; m.textContent = 'Signing in…';
    DWData.signInWithPassword(email, pw).then(start).catch(function (err) { m.className = 'msg bad'; m.textContent = err.message || 'That did not work.'; });
  });
  $('magic').addEventListener('click', function () {
    var m = $('auth-msg');
    DWData.sendMagicLink($('email').value.trim(), location.origin + '/hq/')
      .then(function () { m.className = 'msg ok'; m.textContent = 'Link sent. Open it on this phone.'; })
      .catch(function (err) { m.className = 'msg bad'; m.textContent = err.message || 'Could not send it.'; });
  });

  /* ---- routing ---- */
  function seg() { var h = (location.hash || '#/hq').replace(/^#\/?/, '').split('/'); return { area: h[0] || 'hq', tab: h[1] || '' }; }
  function markTab(key) {
    [].forEach.call(document.querySelectorAll('.ap-tabs a'), function (a) { a.classList.toggle('is-on', a.getAttribute('data-t') === key); });
  }
  function route() {
    var s = seg(); window.scrollTo(0, 0);
    if (document.querySelector('.hq-drawer')) document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    document.body.classList.toggle('ap-noFab', s.area === 'app');
    if (s.area === 'app') {
      markTab('more');
      if (s.tab === 'alerts') { titleEl.textContent = 'Alerts'; return alerts(); }
      titleEl.textContent = 'More'; return more();
    }
    if (s.area !== 'hq') { history.replaceState(null, '', '#/hq'); s = { area: 'hq', tab: '' }; }
    titleEl.textContent = TITLES[s.tab] || 'Workspace';
    markTab({ '': 'today', board: 'board', projects: 'projects', dashboards: 'dashboards' }[s.tab] || 'more');
    DWHq.view(view, say, ME);
    if (s.tab === '') installHint();
    if (s.tab === 'board') setTimeout(boardDots, 60);
    if (s.tab === 'inbox' && Date.now() - lastSync > 60000) sync(true);
  }
  window.addEventListener('hashchange', route);

  /* a row of dots under the swipeable board so you know where you are */
  function boardDots() {
    var hs = view.querySelector('.hq-s'); if (hs && /Drag/.test(hs.textContent)) hs.textContent = 'Swipe sideways for each column. Tap a job to open it and change its column.';
    var b = view.querySelector('.hq-board'); if (!b || b.nextElementSibling && b.nextElementSibling.className === 'ap-dots') return;
    var cols = b.querySelectorAll('.hq-col'), d = document.createElement('div'); d.className = 'ap-dots';
    d.innerHTML = [].map.call(cols, function (c, i) { return '<i' + (i ? '' : ' class="on"') + '></i>'; }).join('');
    b.after(d);
    b.addEventListener('scroll', function () {
      var i = Math.round(b.scrollLeft / (cols[0].offsetWidth + 10));
      [].forEach.call(d.children, function (x, j) { x.classList.toggle('on', j === i); });
    }, { passive: true });
  }
  new MutationObserver(function () { if (seg().tab === 'board') boardDots(); }).observe(view, { childList: true, subtree: false });

  function sync(quiet) {
    lastSync = Date.now();
    return fn({ action: 'mail_sync' }).then(function (r) {
      if (r.added) { say(r.added + ' new email' + (r.added === 1 ? '' : 's'), 'ok'); return DWHq.refresh(); }
      if (!quiet) say('Inbox up to date');
    }).catch(function (e) { if (!quiet) say(e.message, 'bad'); });
  }

  $('refresh').addEventListener('click', function () {
    var b = this; b.classList.add('spin');
    var work = seg().tab === 'inbox' ? sync(false) : Promise.resolve();
    work.then(function () { return seg().area === 'hq' ? DWHq.refresh() : route(); })
      .catch(function (e) { say(e.message, 'bad'); }).then(function () { b.classList.remove('spin'); badges(); });
  });
  $('search').addEventListener('click', function () {
    if (seg().area !== 'hq') { location.hash = '#/hq'; }
    setTimeout(function () { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true })); }, 50);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && seg().area === 'hq' && !document.querySelector('.hq-drawer,.ap-sheet')) DWHq.refresh().then(badges).catch(function () {});
  });

  /* ---- More ---- */
  function ic(d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' + d + '</svg>'; }
  function more() {
    var row = function (h, label, sub, svg) { return '<a href="' + h + '">' + ic(svg) + '<span>' + label + (sub ? '<br><small>' + sub + '</small>' : '') + '</span>' + ic('<path d="m9 6 6 6-6 6"/>') + '</a>'; };
    view.innerHTML = '<p class="ap-h">Work</p><div class="ap-list">' +
      row('#/hq/pipeline', 'Pipeline', 'Clients and prospects by stage', '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>') +
      row('#/hq/inbox', 'Inbox', '<span id="inboxsub">info@dunnworks.io, matched to projects</span>', '<path d="M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6H3v-6z"/>') +
      row('#/hq/assistant', 'Assistant', 'Ask, draft, summarise or plan jobs', '<path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>') +
      row('#/hq/docs', 'Docs', 'Plans, briefs and notes', '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>') +
      row('#/hq/calendar', 'Calendar', 'Launches, chases and due jobs', '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>') +
      row('#/hq/repos', 'Repos', 'GitHub, last commit and Pages', '<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-6 8"/>') +
      '</div><p class="ap-h">This phone</p><div class="ap-list">' +
      '<button type="button" id="themerow">' + ic('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>') + '<span>Theme<br><small id="themelbl">' + (theme() === 'light' ? 'Light' : 'Dark') + '</small></span></button>' +
      row('#/app/alerts', 'Alerts', 'New client email, enquiries, morning summary', '<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>') +
      (standalone() ? '' : '<button type="button" id="install">' + ic('<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>') + '<span>Add to home screen<br><small>' + (isIos ? 'Share, then Add to Home Screen' : 'Install it as an app') + '</small></span></button>') +
      '<a href="/console/" target="_blank" rel="noopener">' + ic('<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>') + '<span>Full console<br><small>Keys, packs, previews and the rest</small></span></a>' +
      '<button type="button" id="signout">' + ic('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>') + '<span>Sign out</span></button></div>';
    $('themerow').addEventListener('click', function () { applyTheme(theme() === 'light' ? 'dark' : 'light', true); });
    $('signout').addEventListener('click', function () { DWData.signOut().then(function () { location.hash = ''; location.reload(); }); });
    var ins = $('install'); if (ins) ins.addEventListener('click', install);
  }
  function install() {
    if (INSTALL) { INSTALL.prompt(); INSTALL.userChoice.then(function () { INSTALL = null; route(); }); return; }
    say(isIos ? 'In Safari: tap Share (the square with the arrow), then Add to Home Screen.' : 'Open your browser menu and choose Install app or Add to Home screen.');
  }
  function installHint() {
    if (standalone()) return;
    try { if (localStorage.getItem('dwhq-hint') === 'no') return; } catch (e) {}
    var box = document.createElement('div'); box.className = 'ap-install';
    box.innerHTML = '<span><b>Put this on your home screen</b><br>' + (isIos ? 'Tap Share, then Add to Home Screen. Alerts on iPhone only work once it is installed.' : 'Install it and it opens like an app, with alerts.') + '</span>' +
      (INSTALL ? '<button class="mini go" type="button" data-i="go">Install</button>' : '') + '<button class="mini" type="button" data-i="no">Hide</button>';
    box.addEventListener('click', function (e) {
      var a = e.target.getAttribute('data-i');
      if (a === 'go') install();
      if (a === 'no') { try { localStorage.setItem('dwhq-hint', 'no'); } catch (x) {} box.remove(); }
    });
    view.prepend(box);
  }

  /* ---- Alerts ---- */
  var KINDS = [['email', 'New client email', 'When someone from a project emails info@dunnworks.io'],
               ['enquiry', 'Enquiries and bookings', 'Form sends and bookings on any of your sites'],
               ['summary', 'Morning summary', 'Just after 7am: due today, overdue, chases and unread'],
               ['activity', 'Collaborator activity', 'When a collaborator or client changes something']];
  function b64(s) { var p = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
    var a = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i); return a; }
  function reg() { return navigator.serviceWorker.getRegistration('/hq/').then(function (r) { return r || navigator.serviceWorker.register('/hq/sw.js', { scope: '/hq/' }); }); }
  function currentSub() { if (!('serviceWorker' in navigator) || !('PushManager' in window)) return Promise.resolve(null);
    return reg().then(function (r) { return r.pushManager.getSubscription(); }); }
  function device() { var u = navigator.userAgent; return (/iphone/i.test(u) ? 'iPhone' : /ipad/i.test(u) ? 'iPad' : /android/i.test(u) ? 'Android' : /mac/i.test(u) ? 'Mac' : /windows/i.test(u) ? 'Windows' : 'Browser') + (standalone() ? ' app' : ' browser'); }

  function alerts() {
    var supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    if (!supported) {
      view.innerHTML = '<div class="ap-card"><p>' + (isIos && !standalone()
        ? 'On iPhone, alerts only work from the installed app. In Safari tap Share, then Add to Home Screen, open Dunnworks from your home screen and come back here.'
        : 'This browser cannot do push alerts.') + '</p></div>';
      return;
    }
    view.innerHTML = '<p class="note">Checking…</p>';
    currentSub().then(function (sub) {
      if (!sub) {
        view.innerHTML = '<div class="ap-card"><p>' + (Notification.permission === 'denied'
          ? 'Alerts are blocked for this app. Allow notifications for dunnworks.io in your phone settings, then come back.'
          : 'Get a buzz for new client email, enquiries and bookings, collaborator changes and a morning summary. Nothing else.') + '</p>' +
          (Notification.permission === 'denied' ? '' : '<button class="btn btn--wide" id="on" type="button">Turn on alerts</button>') + '</div>';
        var on = $('on'); if (on) on.addEventListener('click', subscribe);
        return;
      }
      return fn({ action: 'push_get', endpoint: sub.endpoint }).then(function (r) {
        if (!r.sub) return fn({ action: 'push_subscribe', sub: sub.toJSON(), device: device() }).then(alerts);
        var p = r.sub.prefs || {};
        view.innerHTML = '<p class="ap-h">Alerts on this ' + esc(device().split(' ')[0]) + '</p><div class="ap-card">' + KINDS.map(function (k) {
          return '<label class="ap-tog"><span>' + k[1] + '<small>' + k[2] + '</small></span><input type="checkbox" data-k="' + k[0] + '"' + (p[k[0]] === false ? '' : ' checked') + '></label>'; }).join('') +
          '</div><div class="ap-row" style="margin-top:14px"><button class="mini go" id="test" type="button">Send a test alert</button><button class="mini" id="off" type="button">Turn off on this phone</button></div>' +
          '<p class="note" style="margin-top:14px">Checked every 10 minutes. ' + (r.sub.last_ok ? 'Last alert delivered ' + new Date(r.sub.last_ok).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '.' : 'Nothing sent yet.') + '</p>';
        view.querySelectorAll('[data-k]').forEach(function (x) { x.addEventListener('change', function () {
          var prefs = {}; view.querySelectorAll('[data-k]').forEach(function (y) { prefs[y.getAttribute('data-k')] = y.checked; });
          fn({ action: 'push_prefs', endpoint: sub.endpoint, prefs: prefs }).then(function () { say('Saved', 'ok'); }).catch(function (e) { say(e.message, 'bad'); });
        }); });
        $('test').addEventListener('click', function () {
          fn({ action: 'push_test', endpoint: sub.endpoint }).then(function (o) { say(o.sent ? 'Sent. It should land in a second or two.' : 'It did not send. Turn alerts off and on again.', o.sent ? 'ok' : 'bad'); }).catch(function (e) { say(e.message, 'bad'); });
        });
        $('off').addEventListener('click', function () {
          fn({ action: 'push_unsubscribe', endpoint: sub.endpoint }).catch(function () {}).then(function () { return sub.unsubscribe(); }).then(function () { say('Alerts off on this phone'); alerts(); });
        });
      });
    }).catch(function (e) { view.innerHTML = '<p class="msg bad">' + esc(e.message) + '</p>'; });
  }
  function subscribe() {
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { say('Alerts not allowed', 'bad'); return alerts(); }
      return Promise.all([fn({ action: 'push_key' }), reg()]).then(function (o) {
        if (!o[0].key) throw new Error('No alert key on the server yet');
        return o[1].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(o[0].key) });
      }).then(function (sub) { return fn({ action: 'push_subscribe', sub: sub.toJSON(), device: device() }).then(function () { return sub; }); })
        .then(function (sub) { say('Alerts on', 'ok'); alerts();
          return fn({ action: 'push_test', endpoint: sub.endpoint }); });
    }).catch(function (e) { say(e.message, 'bad'); });
  }

  /* ---- quick add a job ---- */
  $('fab').addEventListener('click', function () {
    var ps = PROJECTS.filter(function (p) { return p.hq_group !== 'prospect'; });
    var bg = document.createElement('div'); bg.className = 'ap-sheet-bg';
    var sh = document.createElement('form'); sh.className = 'ap-sheet';
    sh.innerHTML = '<h2>New job</h2><label for="qa-t">Job</label><input id="qa-t" name="title" required placeholder="What needs doing">' +
      '<label for="qa-p">Project</label><select id="qa-p" name="project" required><option value="">Pick a project</option>' + ps.map(function (p) {
        return '<option value="' + p.id + '">' + esc(p.name) + '</option>'; }).join('') + '</select>' +
      '<div class="ap-two"><div><label for="qa-d">Due</label><input id="qa-d" type="date" name="due"></div>' +
      '<div><label for="qa-o">Whose</label><select id="qa-o" name="owner"><option value="me">Mine</option><option value="client">Client</option></select></div></div>' +
      '<label for="qa-x">Details</label><textarea id="qa-x" name="details" rows="3" placeholder="Optional"></textarea>' +
      '<button class="btn" type="submit">Add job</button>';
    var close = function () { bg.remove(); sh.remove(); };
    bg.addEventListener('click', close);
    sh.addEventListener('submit', function (e) {
      e.preventDefault(); var f = sh.elements;
      if (!f.title.value.trim() || !f.project.value) { say('Give it a name and a project', 'bad'); return; }
      sh.querySelector('button').disabled = true;
      DWData.rest('dw_project_tasks', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: {
        project_id: f.project.value, title: f.title.value.trim(), details: f.details.value.trim() || null,
        due_on: f.due.value || null, owner: f.owner.value, sort_order: 500 } })
        .then(function () { close(); say('Job added', 'ok'); return DWHq.refresh(); })
        .catch(function (err) { sh.querySelector('button').disabled = false; say(err.message, 'bad'); });
    });
    document.body.append(bg, sh);
    setTimeout(function () { $('qa-t').focus(); }, 80);
  });

  function badges() {
    DWData.rest('dw_inbox?select=id&is_read=eq.false&archived=eq.false').then(function (r) {
      var n = (r || []).length, b = $('morebadge'); b.hidden = !n; b.textContent = n > 99 ? '99+' : n;
      var s = $('inboxsub'); if (s && n) s.textContent = n + ' unread';
    }).catch(function () {});
  }

  /* ---- boot ---- */
  function start() {
    gate.hidden = true; app.hidden = false;
    fn({ action: 'me' }).catch(function () { return { owner: false }; }).then(function (me) {
      if (me.owner === false) {
        view.innerHTML = '<div class="ap-card"><p>This app is Tony\'s own workspace. Collaborators use the console instead.</p><a class="btn" href="/console/#/hq">Open the console</a></div>';
        $('tabs').hidden = true; $('fab').hidden = true; return;
      }
      ME = { owner: true, email: me.email || '', member: null };
      DWData.rest('dw_projects?select=id,name,hq_group&order=name.asc').then(function (r) { PROJECTS = r || []; }).catch(function () {});
      if (!location.hash || !/^#\/(hq|app)/.test(location.hash)) history.replaceState(null, '', '#/hq');
      route(); badges();
    });
  }
  DWData.whoami().then(function (u) { if (u && u.email) start(); else gate.hidden = false; }).catch(function () { gate.hidden = false; });
})();
</script>
</body>
</html>
